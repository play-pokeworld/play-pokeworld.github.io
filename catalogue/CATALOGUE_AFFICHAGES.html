<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéWorld — Catalogue des affichages (v7)</title>
<style>
/* ============================================================================
   1. JETONS — 10 thèmes. Une seule source de vérité : les variables.
   Aucun composant ne contient de couleur en dur.
   ============================================================================ */
:root{
  --pw-bg-surface:#24221E; --pw-bg-header:#1C1A17; --pw-bg-sprite:#2B2924; --pw-bg-page:#101012;
  --pw-border-color:#4A3E31; --pw-text-primary:#ECDEB7; --pw-text-secondary:#C8BBA0;
  --pw-accent:#FFE15E; --pw-text-on-accent:#1C1A17;
  --dark1:#36342F; --dark2:#444138; --dark3:#524F48; --light1:#C9BC9C; --light2:#ECDEB7;
  --ok:#82D382; --warn:#DDA863; --bad:#DB7070; --shield:#868DEE; --heal:#DD86EE;
  --radius:10px; --radius-sm:7px; --gap:8px;
  --type-fire:#FF7A3D; --type-water:#3DA5D9; --type-grass:#7FB069; --type-normal:#C9BC9C;
  --type-poison:#A83A63; --type-flying:#8B7CF6; --type-rock:#C4A272; --type-bug:#9CB22B;
  --type-electric:#E8B93B; --type-psychic:#E06C9F; --type-ice:#6FC7D6; --type-dark:#5A5048;
}
[data-theme="light"]{
  --pw-bg-surface:#F5EFEB; --pw-bg-header:#EAE0D6; --pw-bg-sprite:#E0D4C8; --pw-bg-page:#CFC3B4;
  --pw-border-color:#C0AE97; --pw-text-primary:#2C261F; --pw-text-secondary:#5C5247;
  --pw-accent:#806A4E; --pw-text-on-accent:#F5EFEB;
  --dark1:#E8E0D0; --dark2:#F5F0E0; --dark3:#D8CDB5; --light1:#806A4E; --light2:#4A3B2A;
}
[data-theme="gameboy"]{
  --pw-bg-surface:#8BAC0F; --pw-bg-header:#9BBC0F; --pw-bg-sprite:#82A20E; --pw-bg-page:#0F380F;
  --pw-border-color:#306230; --pw-text-primary:#0F380F; --pw-text-secondary:#123A12;
  --pw-accent:#BCD4BC; --pw-text-on-accent:#0F380F;
  --dark1:#0F380F; --dark2:#306230; --dark3:#8BAC0F; --light1:#BCD4BC; --light2:#C2D66D;
}
[data-theme="fire"]{
  --pw-bg-surface:#2C1810; --pw-bg-header:#1F1009; --pw-bg-sprite:#3A1D12; --pw-bg-page:#140A06;
  --pw-border-color:#6B2F1C; --pw-text-primary:#FFDAB9; --pw-text-secondary:#C97B4E;
  --pw-accent:#FF7A3D; --pw-text-on-accent:#1F1009;
  --dark1:#3A1D12; --dark2:#4A2520; --dark3:#5C2E23; --light1:#C97B4E; --light2:#FFDAB9;
}
[data-theme="ocean"]{
  --pw-bg-surface:#0B1F2A; --pw-bg-header:#08161F; --pw-bg-sprite:#0E2233; --pw-bg-page:#050F16;
  --pw-border-color:#1E4A63; --pw-text-primary:#DCEEF8; --pw-text-secondary:#6FA8C4;
  --pw-accent:#3DA5D9; --pw-text-on-accent:#041B26;
  --dark1:#0E2233; --dark2:#123043; --dark3:#1A4257; --light1:#6FA8C4; --light2:#DCEEF8;
}
[data-theme="forest"]{
  --pw-bg-surface:#162414; --pw-bg-header:#132013; --pw-bg-sprite:#1B2A1B; --pw-bg-page:#0A120A;
  --pw-border-color:#2F4A2B; --pw-text-primary:#E7F2DA; --pw-text-secondary:#B4CBA4;
  --pw-accent:#7FB069; --pw-text-on-accent:#10200F;
  --dark1:#1B2A1B; --dark2:#22331F; --dark3:#2C4028; --light1:#8FAE7C; --light2:#E7F2DA;
}
[data-theme="sakura"]{
  --pw-bg-surface:#FDF2F5; --pw-bg-header:#F6E1E8; --pw-bg-sprite:#EED3DC; --pw-bg-page:#E7CDD7;
  --pw-border-color:#D9AFC0; --pw-text-primary:#3A2029; --pw-text-secondary:#6E4A57;
  --pw-accent:#A83A63; --pw-text-on-accent:#FDF2F5;
  --dark1:#F6E1E8; --dark2:#FDF2F5; --dark3:#EED3DC; --light1:#6E4A57; --light2:#3A2029;
}
[data-theme="midnight"]{
  --pw-bg-surface:#16161E; --pw-bg-header:#08080B; --pw-bg-sprite:#101014; --pw-bg-page:#050508;
  --pw-border-color:#2A2A3A; --pw-text-primary:#E6E6F0; --pw-text-secondary:#8B8BA8;
  --pw-accent:#8B7CF6; --pw-text-on-accent:#08080B;
  --dark1:#101014; --dark2:#16161E; --dark3:#1F1F2A; --light1:#8B8BA8; --light2:#E6E6F0;
}
[data-theme="desert"]{
  --pw-bg-surface:#3A2E1E; --pw-bg-header:#2A2116; --pw-bg-sprite:#4A3B26; --pw-bg-page:#1D1710;
  --pw-border-color:#6B563A; --pw-text-primary:#F6E7C6; --pw-text-secondary:#C4A272;
  --pw-accent:#E0A64B; --pw-text-on-accent:#201A10;
  --dark1:#3A2E1E; --dark2:#4A3B26; --dark3:#5A4830; --light1:#C4A272; --light2:#F6E7C6;
}
[data-theme="contrast"]{
  --pw-bg-surface:#000; --pw-bg-header:#000; --pw-bg-sprite:#0A0A0A; --pw-bg-page:#000;
  --pw-border-color:#FFF; --pw-text-primary:#FFF; --pw-text-secondary:#F2F2F2;
  --pw-accent:#FFE400; --pw-text-on-accent:#000;
  --dark1:#000; --dark2:#0D0D0D; --dark3:#1A1A1A; --light1:#F2F2F2; --light2:#FFF;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0B0B0D;color:#D8D2C6;font:400 14px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}

/* ---------------------------------------------------------------- chrome du banc */
.bench{display:flex;flex-direction:column;height:100%}
.bench-top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#151518;
  border-bottom:1px solid #26262C;flex-wrap:wrap}
.bench-top .brand{font-weight:800;letter-spacing:.4px;color:#FFE15E;font-size:15px}
.bench-top .sub{color:#7C7768;font-size:12px}
.ctl{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.ctl .lbl{color:#7C7768;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.seg{display:flex;background:#1E1E24;border:1px solid #2E2E36;border-radius:8px;overflow:hidden}
.seg button{all:unset;padding:6px 11px;font-size:12px;color:#B7B1A4;cursor:pointer}
.seg button[aria-pressed="true"]{background:#FFE15E;color:#141414;font-weight:700}
select,input[type=text]{background:#1E1E24;border:1px solid #2E2E36;border-radius:8px;color:#E6E1D6;
  padding:6px 9px;font:inherit;font-size:12px}
.bench-body{display:flex;flex:1;min-height:0}
.side{width:288px;flex:0 0 288px;overflow-y:auto;border-right:1px solid #22222A;background:#121215;padding:8px 0 40px}
.side h4{position:sticky;top:0;margin:0;padding:10px 14px 6px;background:#121215z;font-size:10.5px;
  letter-spacing:1.4px;text-transform:uppercase;color:#6E6A5F;background:#121215;z-index:2}
.side a{display:block;padding:6px 14px;color:#B7B1A4;text-decoration:none;font-size:12.5px;
  border-left:3px solid transparent;cursor:pointer}
.side a:hover{background:#191920;color:#EDE7DA}
.side a.on{background:#1E1E24;color:#FFE15E;border-left-color:#FFE15E;font-weight:600}
.side a .tag{float:right;font-size:9.5px;color:#615D54;letter-spacing:.5px;text-transform:uppercase}
.stage-wrap{flex:1;min-width:0;overflow:auto;display:flex;justify-content:center;padding:22px;align-items:flex-start}
.note{max-width:1180px;margin:0 auto 14px;color:#8B8578;font-size:12.5px;line-height:1.6}
.note b{color:#D8D2C6}
.compose{margin-top:10px;font-size:11.5px;color:#7C7768;text-align:center}
.compose code{background:#1A1A20;padding:1px 5px;border-radius:4px;color:#A9A392}

/* ---------------------------------------------------------------- appareils */
.frame{position:relative;background:var(--pw-bg-page);color:var(--pw-text-primary);
  border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.55)}
.frame.pc{width:1280px;height:800px}
.frame.mobile{width:390px;height:844px}
.frame.tablet{width:768px;height:1024px}
.stage{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------------------------------------------------------------- briques communes */
.topb{display:flex;align-items:center;gap:10px;height:56px;flex:0 0 56px;padding:0 12px;
  background:var(--pw-bg-header);border-bottom:1px solid var(--pw-border-color)}
.topb .pokeball{width:36px;height:36px;border-radius:50%;background:var(--pw-accent);
  display:flex;align-items:center;justify-content:center;flex:0 0 36px;box-shadow:0 0 0 3px color-mix(in srgb,var(--pw-accent) 35%,transparent)}
.topb .brand{font-weight:800;font-size:15px;letter-spacing:.3px}
.topb .meta{margin-left:auto;font-size:12px;color:var(--pw-text-secondary)}
.topb .gear{width:36px;height:36px;border-radius:50%;border:2px solid var(--pw-border-color);
  display:flex;align-items:center;justify-content:center;color:var(--pw-text-secondary)}
.navb{display:flex;height:64px;flex:0 0 64px;background:var(--pw-bg-header);border-top:1px solid var(--pw-border-color)}
.navb .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;color:var(--pw-text-secondary)}
.navb .t.on{color:var(--pw-text-on-accent);background:var(--pw-accent);font-weight:700}
.navb .t svg{width:20px;height:20px}

.win{background:var(--pw-bg-surface);border:1px solid var(--pw-border-color);border-radius:var(--radius);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.win-h{display:flex;align-items:center;gap:8px;height:42px;flex:0 0 42px;padding:0 12px;
  font-size:13px;font-weight:700;color:var(--pw-text-primary);
  background:color-mix(in srgb,var(--pw-bg-header) 70%,var(--pw-bg-surface));
  border-bottom:1px solid var(--pw-border-color)}
.win-h .r{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--pw-text-secondary)}
.win-b{flex:1;min-height:0;overflow:visible;padding:10px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--pw-border-color);
  background:transparent;color:var(--pw-text-secondary);font-size:12px;cursor:pointer}
.tab.on{background:var(--pw-accent);border-color:var(--pw-accent);color:var(--pw-text-on-accent);font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:var(--radius-sm);
  border:1px solid var(--pw-border-color);background:var(--pw-bg-surface);color:var(--pw-text-primary);
  font-weight:600;font-size:13px;cursor:pointer;padding:0 14px}
.btn.p{background:var(--light1);border-color:var(--light1);color:var(--pw-bg-header);font-weight:800}
.btn.danger{background:#DB5B4A;border-color:#FF9292;color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px}

.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--pw-bg-surface) 60%,var(--pw-bg-header));border:1px solid var(--pw-border-color)}
.row .av{width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:var(--pw-bg-sprite);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.row .av img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.row .tx{flex:1;min-width:0}
.row .a{font-size:12.5px;font-weight:600}
.row .b2{font-size:11px;color:var(--pw-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{display:flex;color:var(--pw-text-secondary);transform:rotate(180deg)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;
  font-size:10.5px;font-weight:600;border:1px solid var(--pw-border-color);background:var(--pw-bg-sprite)}
.chip.up{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.chip.down{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.chip.st{color:var(--shield);border-color:color-mix(in srgb,var(--shield) 55%,transparent)}
.chip.zone{background:color-mix(in srgb,var(--pw-accent) 20%,var(--pw-bg-surface));color:var(--pw-text-primary)}
.lvl{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--light1);color:var(--pw-bg-header);
  font-size:10px;font-weight:800;letter-spacing:.3px}
.seclbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--pw-text-secondary);margin:10px 2px 5px}

/* barres de PV empilees (couches PV / bouclier / soin) */
.hpstack{position:relative;height:7px;border-radius:3px;overflow:hidden;
  background:color-mix(in srgb,var(--light1) 30%,transparent)}
.hpstack i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;transition:width .4s}
.hpstack .fill{background:var(--ok)}
.hpstack .mid .fill{background:var(--warn)}
.hpstack .low .fill{background:var(--bad)}

/* pastilles de stats */
.dots{display:inline-flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--light1) 30%,transparent)}
.dots i.on{background:var(--pw-accent)}
.stars{color:var(--shield);letter-spacing:1px;font-size:10px}

/* cellule pokémon */
.mon{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--pw-bg-sprite) 75%,var(--pw-bg-surface));border:1px solid var(--pw-border-color)}
.mon .no{font-size:9px;color:const(--pw-text-secondary);color:var(--pw-text-secondary);align-self:flex-start}
.mon img{width:52px;height:52px;image-rendering:pixelated}
.mon .nm{font-size:10.5px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mon.sel{border-color:var(--pw-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--pw-accent) 45%,transparent)}

/* ligne d'attaque (grammaire PokéChill) */
.mv{position:relative;display:flex;align-items:center;height:30px;border-radius:6px;overflow:hidden;
  border:2px solid var(--pw-border-color);background:var(--dark2);color:#fff;padding-left:8px;font-size:12px}
.mv .bar{position:absolute;inset:0 auto 0 0;opacity:.32}
.mv span{position:relative;z-index:2;display:flex;align-items:center;gap:5px}
.mv .ico{margin-left:auto;width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;font-size:11px;font-weight:800;color:#101010}
.mv .cd{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:1}
.mv.idle{background:var(--dark1);border-color:var(--pw-border-color);color:var(--pw-text-secondary);font-size:11px}

/* ---------------------------------------------------------------- cartes de combat */
.cbh{border-radius:var(--radius);overflow:hidden;position:relative;background-size:cover;background-position:center 40%;
  box-shadow:0 5px 14px rgba(0,0,0,.4);display:flex;gap:8px;padding:8px;flex:0 0 auto}
.cbh .zone-chips{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:5}
.cbh .spr{width:104px;flex:0 0 104px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.cbh .spr .shadow{position:absolute;bottom:6px;width:66px;height:14px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px)}
.cbh .spr img.pkmn{width:88px;height:88px;image-rendering:pixelated;z-index:2;position:relative;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.cbh .buffs{position:absolute;left:-2px;bottom:-4px;display:flex;flex-direction:column;gap:3px;z-index:4}
.cbh .ibox{flex:1;min-width:0;background:var(--light2);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:4px}
.cbh .hpbox{background:var(--dark1);border-radius:6px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 2px 6px rgba(0,0,0,.35);color:#fff}
.cbh .hpbox .nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.cbh .hpbox .nm .lvl{margin-left:0}
.cbh .hpbox .num{margin-left:auto;font-size:10px;opacity:.8}
.cbh .moves{display:flex;flex-direction:column;gap:3px}

.teamcard{border:2px solid var(--light1);border-radius:var(--radius);background:var(--dark2);padding:7px;
  display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.member{display:flex;gap:8px;align-items:center;border-radius:8px;padding:6px;position:relative;overflow:hidden}
.member.active{background:var(--light1)}
.member.active .ibox2{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.member.active .hpbox{background:var(--dark1);border-radius:6px;padding:5px 7px;display:flex;flex-direction:column;gap:3px;color:#fff}
.member .flair{position:absolute;width:180px;height:180px;border-radius:50%;left:-70px;top:-70px;
  background:repeating-conic-gradient(from 0deg,transparent 0 18deg,color-mix(in srgb,var(--light1) 55%,transparent) 18deg 36deg);
  opacity:.28;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.member img.pkmn{width:66px;height:66px;image-rendering:pixelated;position:relative;z-index:2}
.member.mini img.pkmn{width:42px;height:42px}
.member.mini .name{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.member.mini{color:var(--pw-text-primary)}

.drops{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:4px 2px}
.drop{position:relative;width:40px;height:40px;border-radius:8px;background:var(--pw-bg-sprite);
  border:1px solid var(--pw-border-color);display:flex;align-items:center;justify-content:center}
.drop img{width:30px;height:30px;image-rendering:pixelated}
.drop .q{position:absolute;bottom:-4px;right:-4px;background:var(--pw-bg-header);border:1px solid var(--pw-border-color);
  border-radius:5px;font-size:9px;padding:0 3px}

/* ---------------------------------------------------------------- feuilles / modales */
.scrim{position:absolute;inset:0;background:rgba(6,7,10,.5);z-index:8}
.sh{position:absolute;left:10px;right:10px;bottom:10px;z-index:9;background:var(--pw-bg-surface);
  border:1px solid var(--pw-border-color);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 -8px 30px rgba(0,0,0,.45);max-height:calc(100% - 20px);overflow-y:auto}
.sh{container-type:inline-size}
.sh h3{margin:0;font-size:15px}
.sh .s{font-size:12px;color:var(--pw-text-secondary);margin:0}
.sh.centered{align-items:center;text-align:center}
.sh.pcmodal{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(680px,92%);max-height:86%}
.sh.pcmodal .acts .btn{flex:1}
.sh{overflow-y:auto}
.sh .acts{display:flex;gap:8px;width:100%;flex:0 0 auto}
.sh .acts .btn{flex:1}

/* ---------------------------------------------------------------- plein ecran */
.fs{flex:1;min-height:0;display:flex;flex-direction:column}
.fs-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--pw-border-color);
  background:var(--pw-bg-header)}
.fs-h .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--pw-border-color);
  display:flex;align-items:center;justify-content:center;color:var(--pw-text-secondary)}
.fs-h .ttl{font-weight:800;font-size:14px}
.fs-h .x{margin-left:auto;font-size:12px;color:var(--pw-text-secondary)}
.fs-b{flex:1;min-height:0;overflow-y:auto;padding:12px;container-type:inline-size}

/* ---------------------------------------------------------------- dashboard PC */
.dash{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:300px 1fr 300px;gap:10px;padding:10px;align-items:start}
.dash .col{display:flex;flex-direction:column;gap:10px;min-height:0}
.dash::-webkit-scrollbar{width:8px}
.win{flex:0 0 auto}
.focus{outline:2px solid var(--pw-accent);outline-offset:1px}
.dim{opacity:.35;filter:saturate(.5)}

/* ---------------------------------------------------------------- divers */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.kv .k{color:var(--pw-text-secondary)}
.grid{display:grid;gap:6px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px;color:var(--pw-text-secondary);
  font-size:12px;text-align:center}
.mapimg{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.banner{height:120px;background-size:cover;background-position:center 40%;position:relative}

/* ============================================================================
   v7.2 — DEUX GRAMMAIRES, UN SEUL JEU DE COMPOSANTS
   a) v5 restaurée : pastilles de filtre, grille de disques, sac en lignes
   b) PokéChill empruntée : colonne étroite, sections pleine largeur
   Aucune couleur en dur : tout passe par les variables de thème.
   ========================================================================== */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);color:var(--pw-text-primary);
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.pill.on{background:var(--pw-accent);border-color:var(--pw-accent);color:var(--pw-text-on-accent);font-weight:800}

.filtercard{border:1px solid var(--pw-border-color);border-radius:var(--radius-sm);padding:9px 10px 10px}
.objbar{display:flex;align-items:center;gap:10px;border:1px solid var(--pw-border-color);
  border-radius:var(--radius-sm);padding:6px 9px;margin-bottom:8px}
.objbar .r{margin-left:auto;font-size:11.5px;color:var(--pw-text-secondary)}
.dexgrid{display:grid;gap:2px 4px;grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.dexcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 2px}
.dexcell .no{font-size:10px;color:var(--pw-text-secondary)}
.dexcell .disc{position:relative;width:100%;max-width:62px;aspect-ratio:1;border-radius:50%;
  background:var(--pw-bg-sprite);border:1px solid var(--pw-border-color);
  display:flex;align-items:center;justify-content:center}
.dexcell .disc img{width:66%;height:66%;object-fit:contain;image-rendering:pixelated}
.dexcell .disc .shy{position:absolute;right:-1px;top:-1px;width:15px;height:15px;border-radius:50%;
  background:var(--pw-accent);color:var(--pw-text-on-accent);display:flex;align-items:center;justify-content:center}
.dexcell .nm{font-size:10.5px;font-weight:600;text-align:center;max-width:100%;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.dexcell.sel .disc{border-color:var(--pw-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--pw-accent) 40%,transparent)}
.baglist{display:grid;gap:7px;grid-template-columns:1fr}
@container (min-width:460px){.baglist{grid-template-columns:1fr 1fr}}
@container (min-width:820px){.baglist{grid-template-columns:1fr 1fr 1fr}}
.bagrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;
  background:var(--pw-bg-header);border:1px solid var(--pw-border-color)}

.bagrow .nm{flex:1;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stgrid{display:grid;gap:6px;grid-template-columns:repeat(3,minmax(0,1fr))}
@container (max-width:419px){.stcard{padding:10px 4px 8px}.stcard img{width:38px;height:38px}.stcard .nn{font-size:11px}.stcard .nn2{font-size:9px}}
.stcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 12px;border-radius:10px;
  background:var(--light2);border:1px solid var(--light1);color:#1C1A17}

.stcard .nn{font-size:12.5px;font-weight:800;margin-top:4px}

.inp{border:1px solid var(--pw-border-color);border-radius:8px;padding:9px 11px;font-size:12.5px;font-weight:600}
.note{width:100%;font-size:11px;color:var(--pw-text-secondary);text-align:center;padding:7px 10px;
  border-radius:8px;background:var(--pw-bg-header);border:1px solid var(--pw-border-color)}
/* --- PokéChill : colonne étroite + sections pleine largeur --- */
.narrow{max-width:760px;margin:0 auto}

/* ============================================================================
   v8 — DA globale : fenêtre à actions d'en-tête, cartes arrondies, cadres qui
   sortent de la barre (grammaire "lieu" étendue), barres de progression.
   Aucune couleur en dur : uniquement les variables de thème.
   ========================================================================== */
.win-h .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.win-h .r + .acts{margin-left:8px}
.hb{width:22px;height:22px;border-radius:50%;border:1px solid var(--pw-border-color);
  display:flex;align-items:center;justify-content:center;color:var(--pw-text-secondary);
  font-size:11px;font-weight:800;line-height:1;background:transparent;font-family:inherit}
.hb.sq{border-radius:6px}
.prog{flex:1 1 60px;min-width:36px;height:7px;border-radius:999px;background:color-mix(in srgb,var(--pw-text-secondary) 25%,transparent);overflow:hidden}
.prog > i{display:block;height:100%;border-radius:999px;background:var(--pw-accent)}
.prog.ok > i{background:var(--ok)}
.progrow{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--pw-text-secondary)}
.card{background:var(--pw-bg-header);border:1px solid var(--pw-border-color);border-radius:12px;padding:10px}
.card.flat{background:transparent}
.card.hi{border-color:var(--pw-accent)}
.seclbl2{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  color:var(--pw-text-secondary);margin:12px 2px 6px}
/* --- cadres qui sortent de la barre --- */
.loc-hero{position:relative;border-radius:12px;overflow:visible;margin:0 0 4px}
.loc-hero .art{height:104px;border-radius:12px;background-size:cover;background-position:center 45%;
  border:1px solid var(--pw-border-color)}
.loc-out{position:absolute;right:8px;top:-16px;display:flex;gap:4px}
.frame36{width:38px;height:44px;border-radius:12px;background:var(--pw-bg-surface);
  border:1px solid var(--pw-border-color);display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;box-shadow:0 3px 0 color-mix(in srgb,var(--pw-bg-page) 60%,transparent)}
.frame36 img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated;margin-bottom:2px}
.rowsp{position:relative;overflow:visible}
.rowsp .out{position:absolute;right:6px;top:-13px;display:flex;gap:3px}
.mini34{width:26px;height:30px;border-radius:8px;background:var(--pw-bg-surface);
  border:1px solid var(--pw-border-color);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.mini34 img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
/* --- équipe (grammaire PokéChill) --- */
.tslot{border:1px solid var(--pw-border-color);border-radius:12px;background:var(--pw-bg-surface);overflow:hidden}
.tslot + .tslot{margin-top:8px}
.tslot-h{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:11.5px;font-weight:700;
  background:color-mix(in srgb,var(--pw-bg-header) 80%,var(--pw-bg-surface));border-bottom:1px solid var(--pw-border-color)}
.tslot-h .r{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--pw-text-secondary)}
.tslot-b{display:flex;align-items:center;gap:10px;padding:10px;position:relative;
  background-image:radial-gradient(color-mix(in srgb,var(--pw-text-secondary) 12%,transparent) 1px,transparent 1px);
  background-size:7px 7px}
.tslot-b .disc{width:64px;height:64px;flex:0 0 64px;border-radius:50%;background:var(--pw-bg-sprite);
  display:flex;align-items:center;justify-content:center}
.tslot-b .disc img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.tslot-b .plus{width:64px;height:64px;flex:0 0 64px;border-radius:50%;
  border:3px solid color-mix(in srgb,var(--pw-text-secondary) 55%,transparent);
  display:flex;align-items:center;justify-content:center;color:var(--pw-text-secondary)}
.tslot-b .col{flex:1;min-width:0}
.mvrow{display:flex;align-items:center;gap:6px;border-radius:6px;padding:4px 7px;font-size:11px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);margin-top:3px}
.mvrow .bar{height:100%;position:absolute;left:0;top:0;border-radius:6px;opacity:.22}
.mvrow{position:relative;overflow:hidden}
.mvrow .ty{width:15px;height:15px;border-radius:4px;margin-left:auto;display:flex;align-items:center;justify-content:center}
.mvrow.idle{color:var(--pw-text-secondary);justify-content:center}
/* --- combat (grammaire PokéChill) --- */
.bt{display:flex;flex-direction:column;gap:9px}
.btcard{display:flex;border-radius:12px;border:1px solid var(--pw-border-color);overflow:hidden;position:relative}
.btcard.wild{background:var(--pw-bg-header)}
.btcard .art{width:132px;flex:0 0 132px;position:relative;display:flex;align-items:flex-end;justify-content:center;
  background-size:cover;background-position:center}
.btcard .art img{width:92px;height:92px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.btcard .art .badge{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:800;padding:1px 5px;
  border-radius:4px;background:var(--pw-bg-page);color:var(--pw-accent);border:1px solid var(--pw-accent)}
.btcard .info{flex:1;min-width:0;padding:7px 8px;display:flex;flex-direction:column;gap:4px}
.btcard .nm{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
  background:color-mix(in srgb,var(--pw-bg-page) 65%,transparent);border-radius:6px;padding:3px 8px}
.btcard .nm .lv{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;
  background:var(--light1);color:var(--pw-bg-header)}
.btcard .mixcol{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;flex:0 0 96px;
  background:color-mix(in srgb,var(--pw-bg-page) 25%,transparent)}
.btcard .mixcol .disc{width:70px;height:70px;border-radius:50%;background:var(--pw-bg-sprite);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--pw-border-color)}
.btcard .mixcol .disc img{width:62px;height:62px;object-fit:contain;image-rendering:pixelated}
/* --- tuiles d'objet --- */
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);text-align:center}

.tile .ic img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.tile .nm{font-size:10.5px;font-weight:700}
.tile .sb{font-size:9.5px;color:var(--pw-text-secondary)}


/* --- vue d'ensemble du tableau de bord : compact, sans scroll interne --- */
.dashscroll{overflow-y:auto;overflow-x:hidden}

.pbtable{width:100%;border-collapse:collapse;font-size:11px}

.ballicon{width:16px;height:16px;border-radius:50%;display:inline-block}
.scrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:11.5px;font-weight:700;
  border:1px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--pw-bg-header));color:var(--pw-text-primary)}

.moneybig{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0}

.moneybig .l{font-size:10px;color:var(--pw-text-secondary)}
.mapwrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--pw-border-color);height:190px}
.mapzoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}

.badgeTile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);text-align:center}

.servrow{display:flex;gap:9px;align-items:center;padding:9px;border-radius:10px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header)}

.servrow .b2{font-size:10px;color:var(--pw-text-secondary);line-height:1.3}

.qcard .h{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--pw-text-secondary);text-transform:uppercase}
.qcard .t{font-size:12px;font-weight:800}
.qcard .d{font-size:10.5px;color:var(--pw-text-secondary);line-height:1.35}
.rew{display:flex;gap:8px;font-size:10px;color:var(--ok)}
.succgrid{display:grid;gap:7px;grid-template-columns:1fr}
@container (min-width:430px){.succgrid{grid-template-columns:1fr 1fr}}
.filters{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.selbox{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:8px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);font-size:10.5px;color:var(--pw-text-primary)}

.srch{display:flex;flex:1;align-items:center;gap:6px;padding:7px 9px;border-radius:8px;border:1px solid var(--pw-border-color);

/* --- collection (Boîte PC / Pokédex / Succès) : une seule grammaire --- */
.coll-h{display:flex;flex-direction:column;gap:7px}
.coll-stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--pw-text-secondary)}
.coll-stats b{color:var(--pw-text-primary);font-weight:800}
.coll-grid{display:grid;gap:2px 4px;grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 2px}
.cell .no{font-size:9.5px;color:var(--pw-text-secondary)}
.cell .disc{position:relative;width:100%;max-width:58px;aspect-ratio:1;border-radius:50%;
  background:var(--pw-bg-sprite);border:1px solid var(--pw-border-color);display:flex;align-items:center;justify-content:center}
.cell .disc img{width:64%;height:64%;object-fit:contain;image-rendering:pixelated}
.cell .disc .shy{position:absolute;right:-1px;top:-1px;width:14px;height:14px;border-radius:50%;
  background:var(--pw-accent);color:var(--pw-text-on-accent);display:flex;align-items:center;justify-content:center}
.cell .disc .lock{position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,var(--pw-bg-page) 62%,transparent)}

.cell .where{width:100%;font-size:8px;color:var(--pw-text-secondary);text-align:center;line-height:1.1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.sel .disc{border-color:var(--pw-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--pw-accent) 40%,transparent)}

.secbar{display:flex;align-items:center;gap:8px;margin:9px 2px 6px}
