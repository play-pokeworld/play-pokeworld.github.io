.secbar .r{margin-left:auto;font-size:10.5px;color:var(--pw-text-secondary)}


/* --- tableau de bord : mêmes fenêtres que le jeu --- */
.idle{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--pw-border-color);height:150px;
  background-size:cover;background-position:center}
.idle .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:color-mix(in srgb,var(--pw-bg-page) 42%,transparent)}
.idle .txt .a{font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.idle .hint{margin:0 12px;padding:6px 9px;border-radius:7px;font-size:9.5px;line-height:1.3;text-align:center;
  background:color-mix(in srgb,var(--pw-bg-page) 78%,transparent);border:1px solid var(--pw-border-color)}
.teamMini{display:flex;align-items:center;gap:8px;padding:6px;border-radius:9px;border:1px solid var(--pw-border-color);
  background:var(--pw-bg-header);margin-bottom:5px}
.teamMini .disc{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--pw-bg-sprite);
  display:flex;align-items:center;justify-content:center}
.teamMini .disc img{width:28px;height:28px;object-fit:contain;image-rendering:pixelated}
.placeCard{border-radius:10px;overflow:hidden;border:1px solid var(--pw-border-color);margin-bottom:7px}
.placeCard .art{height:64px;background-size:cover;background-position:center 45%}
.placeCard .nm{font-size:12.5px;font-weight:800;padding:6px 9px;background:var(--pw-bg-header)}
.dialog{border-radius:9px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header);padding:8px 9px;
  font-size:10.5px;line-height:1.4;font-style:italic;color:var(--pw-text-secondary);margin-bottom:7px}
.dialog b{font-style:normal;color:var(--pw-text-primary);display:block;margin-bottom:3px}
.scrim.opaque{background:var(--pw-bg-page);opacity:1;backdrop-filter:none}
.pagemenu{display:flex;gap:5px;flex-wrap:wrap;padding:2px 0 10px}
.pagemenu .p{padding:7px 12px;border-radius:9px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header);
  font-size:11.5px;font-weight:700;color:var(--pw-text-secondary)}
.pagemenu .p.on{background:var(--pw-accent);border-color:var(--pw-accent);color:var(--pw-text-on-accent)}


.sheetcard{border:1px solid var(--pw-border-color);border-radius:12px;background:var(--pw-bg-header);padding:10px}
.sheetcard + .sheetcard{margin-top:8px}
.sheethead{display:flex;align-items:center;gap:10px}
.sheethead .disc{width:74px;height:74px;flex:0 0 74px;border-radius:50%;background:var(--pw-bg-sprite);
  border:1px solid var(--pw-border-color);display:flex;align-items:center;justify-content:center}
.sheethead .disc img{width:66px;height:66px;object-fit:contain;image-rendering:pixelated}
.sheethead .nm{font-size:14px;font-weight:800}
.sheethead .num{font-size:10.5px;color:var(--pw-text-secondary)}
.statline{display:grid;grid-template-columns:54px 30px 1fr;align-items:center;gap:7px;font-size:10.5px;margin-top:4px}
.statline .l{color:var(--pw-text-secondary)}
.statline .v{font-weight:800;text-align:right}
.statline .b{height:5px;border-radius:999px;background:color-mix(in srgb,var(--pw-text-secondary) 22%,transparent);overflow:hidden}
.statline .b > i{display:block;height:100%;background:var(--pw-accent);border-radius:999px}
.evo{display:flex;align-items:center;gap:6px;justify-content:space-between}
.evo .e{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--pw-text-secondary)}
.evo .e .disc{width:46px;height:46px;border-radius:50%;background:var(--pw-bg-sprite);display:flex;align-items:center;justify-content:center}
.evo .e .disc img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
.tgt{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;border:1px solid var(--pw-border-color);
  background:var(--pw-bg-header);margin-bottom:6px}
.tgt .disc{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--pw-bg-sprite);display:flex;align-items:center;justify-content:center}
.tgt .disc img{width:33px;height:33px;object-fit:contain;image-rendering:pixelated}
.toolgrid{display:grid;gap:6px;grid-template-columns:repeat(3,minmax(0,1fr))}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:9px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);font-size:9.5px;font-weight:700;text-align:center}
.slotgrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.slot{border-radius:10px;border:1px dashed var(--pw-border-color);background:var(--pw-bg-header);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;
  font-size:9.5px;color:var(--pw-text-secondary);min-height:74px}
.slot.full{border-style:solid;color:var(--pw-text-primary)}
.slot img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.kv2{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:4px 0;border-bottom:1px solid var(--pw-border-color)}
.kv2:last-child{border-bottom:0}
.kv2 .k{color:var(--pw-text-secondary)}
.roomgrid{display:grid;gap:6px;grid-template-columns:1fr 1fr}
.room{border-radius:10px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header);padding:8px;
  display:flex;flex-direction:column;gap:3px;font-size:10.5px}
.room .t{font-weight:700;display:flex;align-items:center;gap:5px}


/* --- base secrete : un seul decor (modele) + objets poses --- */
.baseScene{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--pw-border-color);
  aspect-ratio:16/9;background-image:var(--base-bg);background-size:cover;background-position:center}
.baseScene .obj{position:absolute;transform:translate(-50%,-50%);image-rendering:pixelated}
.baseScene .lab{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;
  background:color-mix(in srgb,var(--pw-bg-page) 80%,transparent);color:var(--pw-text-primary)}
.modelgrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.model{border-radius:9px;border:1px solid var(--pw-border-color);background-size:cover;background-position:center;
  aspect-ratio:1;position:relative;overflow:hidden}
.model.on{border-color:var(--pw-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--pw-accent) 40%,transparent)}
.model .n{position:absolute;left:0;right:0;bottom:0;font-size:8px;font-weight:700;text-align:center;
  background:color-mix(in srgb,var(--pw-bg-page) 72%,transparent);padding:1px 0;color:var(--pw-text-primary)}


/* ===================================================================
   v10a — corrections globales (retour du 2026-11-07)
   Une règle, un problème, toutes les fenêtres concernées.
   =================================================================== */
/* 1. Une seule présentation de fenêtre modale : centrée, jamais collée en bas */
.sh{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
  width:min(520px,calc(100% - 24px));max-height:88%;
  box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sh.pcmodal{width:min(680px,72%)}

/* 2. Raccourcis : la couleur ne vit QUE sur l'icône et le bord du bouton */
.scrow{background:var(--pw-bg-header);
  border:1px solid color-mix(in srgb,var(--c) 50%,var(--pw-border-color))}
.scrow .ic{color:var(--c)}

/* 3. Poké Balls : toutes les lignes à la même hauteur qu'aujourd'hui */
.pbtable tr{height:34px}
.pbtable td{padding:0 4px;height:34px;vertical-align:middle}

/* 4. Tous les affichages ont le fond de Lieu */
.stage{position:relative;background-color:var(--dark1);overflow:hidden}
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:url('../../pokeworld-rework/assets/images/bg/main-bg.png');
  background-repeat:repeat-x;background-position:0 0;opacity:.08}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 20% 0%, rgba(83,157,223,.08), transparent 28%),
    radial-gradient(circle at 80% 10%, rgba(242,217,78,.05), transparent 24%)}
.stage > *{position:relative;z-index:1}

/* 5. Mobile : la fenêtre grandit, c'est le cadre qui défile (bas atteignable) */
/* le .win a overflow:hidden pour ses coins : sur mobile il clippait donc le
   débordement et le cadre ne défilait plus. On rend le débordement au cadre. */
.frame.mobile .win,.frame.tablet .win{height:auto;min-height:100%;overflow:visible}
.frame.mobile .win-b,.frame.tablet .win-b{overflow:visible;flex:0 0 auto}

/* 6. Lieu : le nom du lieu est posé DANS son sprite, pas dans l'en-tête */
.loc-hero .art{position:relative;overflow:hidden}
.loc-hero .plate{position:absolute;left:9px;bottom:9px;display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:9px;font-size:12px;font-weight:800;color:var(--pw-text-primary);
  background:color-mix(in srgb,var(--pw-bg-header) 92%,transparent);
  border:1px solid var(--pw-border-color)}

/* 8. Aucune barre de defilement visible, nulle part (meme regle que le jeu, core/base.css).
   Le defilement reste possible : molette, doigt, clavier. Seul le rail disparait. */
*, *::before, *::after {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

*::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

/* 7. Les sprites d'objets d'un lieu restent DANS leur ligne */
.rowsp{overflow:hidden}
.rowsp .out{position:static;display:flex;gap:4px;margin-left:6px;flex:0 0 auto}

/* 8. Le ? du guide est visible dans tous les en-têtes */
.hb.helpq{font-size:12px;font-weight:800;color:var(--pw-accent);
  border-color:color-mix(in srgb,var(--pw-accent) 45%,var(--pw-border-color))}
.topb .topacts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.topb .gear{flex:0 0 36px}
.topb .topacts .hb{width:30px;height:30px;flex:0 0 30px}

/* 9. Quêtes : respiration, DA du reste du jeu, titre et précisions séparés */
.qcard{gap:8px;padding:12px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--pw-bg-header) 88%,var(--pw-bg-surface)),var(--pw-bg-header))}
.qcard .t{font-size:13px}
.qcard .d{font-size:11px;line-height:1.5}
.qcard .k{font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--pw-text-primary)}

/* 10. Monnaies : affichage horizontal, comme le jeu actuel */
.moneyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.moneyrow .m{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;
  border-radius:10px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header)}
.moneyrow .m .ic{color:var(--pw-accent);display:flex}
.moneyrow .m .v{font-size:14px;font-weight:800}
.moneyrow .m .l{font-size:9.5px;color:var(--pw-text-secondary);text-align:center}

/* 11. Starter : le choix prend TOUT le cadre, rien d'autre n'est visible */
.starter{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:22px;background:var(--pw-bg-page)}
.starter .ttl{font-size:16px;font-weight:800}
.starter .stgrid{width:min(100%,520px)}

/* ===================================================================
   v10b — Équipe et Combat en direct, grammaire PokéChill relevée :
   .explore-team-member (bandeau), .team-held-item, .team-member-slotnumber,
   .explore-header-infobox, .pkmn-movebox, .explore-sprite
   =================================================================== */
/* --- Équipe : un bandeau horizontal par Pokémon --- */
.tl{display:flex;flex-direction:column;gap:8px}
.tband{position:relative;display:flex;align-items:center;gap:6px;padding:7px 9px 7px 6px;
  border-radius:12px;background:var(--pw-bg-sprite);border:1px solid var(--pw-border-color);overflow:hidden}
.tband .tspr{width:70px;height:80px;flex:0 0 70px;display:flex;align-items:flex-end;justify-content:center}
.tband .tspr img{width:66px;height:66px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.tband .hitem{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:0 0 9px 0;
  background:var(--pw-bg-header);border-right:1px solid var(--pw-border-color);
  border-bottom:1px solid var(--pw-border-color);display:flex;align-items:center;justify-content:center;
  color:var(--pw-text-secondary);z-index:3}
.tband .hitem img{width:22px;height:22px;object-fit:contain;image-rendering:pixelated}
.tband .slotno{position:absolute;left:7px;bottom:2px;font-size:10.5px;font-weight:800;
  color:var(--pw-text-secondary);opacity:.6;letter-spacing:.02em}
.tband .tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tband .nmrow{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800}
.tband.empty{opacity:.55;min-height:72px}
.tband.empty .tspr{border:1px dashed var(--pw-border-color);border-radius:10px;color:var(--pw-text-secondary)}

/* --- Combat en direct : bandeau sauvage sur le décor + carte du combattant --- */
.bt{display:flex;flex-direction:column;gap:10px}
.bwild{position:relative;height:200px;border-radius:12px;overflow:hidden;
  border:1px solid var(--pw-border-color);background-size:cover;background-position:center}
.bwild .atk{position:absolute;left:10px;bottom:10px;font-size:9px;font-weight:800;letter-spacing:.06em;
  padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--pw-bg-page) 82%,transparent);
  color:#9FE8F0;border:1px solid #6FC9D6}
.bwild .bspr{position:absolute;left:16px;bottom:32px;width:96px;height:96px;object-fit:contain;
  image-rendering:pixelated;filter:drop-shadow(0 8px 8px rgba(0,0,0,.55))}
.bwild .bbox{position:absolute;right:10px;top:10px;width:min(60%,320px);display:flex;flex-direction:column;
  gap:5px;padding:8px;border-radius:10px;background:color-mix(in srgb,var(--pw-bg-page) 84%,transparent);
  border:1px solid color-mix(in srgb,var(--light1) 55%,var(--pw-border-color))}
.bme{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
  background:color-mix(in srgb,var(--pw-bg-surface) 78%,var(--pw-bg-header));
  border:2px solid color-mix(in srgb,var(--pw-accent) 45%,var(--pw-border-color))}
.bme .bflair{width:100px;height:100px;flex:0 0 100px;border-radius:50%;
  background:color-mix(in srgb,var(--pw-bg-page) 42%,transparent);
  display:flex;align-items:center;justify-content:center}
.bme .bflair .bspr{width:82px;height:82px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.45))}
.bme .bbox{position:static;width:auto;flex:1;min-width:0;padding:0;border:0;background:transparent;
  display:flex;flex-direction:column;gap:5px}
.bbox .nmrow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800}
.bbox .nmrow .lvl{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;
  background:var(--light1);color:var(--pw-bg-header)}
.bbox .nmrow .hpnum{margin-left:auto;font-size:10px;color:var(--pw-text-secondary)}
.bbox .bmv{display:flex;flex-direction:column;gap:4px}
.brow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bmini{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:9px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);opacity:.85}
.bmini img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated}
.bmini .n{font-size:10.5px;font-weight:700}
.bmini .h{font-size:9.5px;color:var(--pw-text-secondary)}

/* --- Poké Balls : plus rien ne dépasse du cadre --- */
.pbtable{table-layout:fixed}
.pbtable th:first-child,.pbtable td:first-child{width:auto}
.pbtable th:nth-child(2),.pbtable td:nth-child(2){width:34px}
.pbtable th:last-child,.pbtable td:last-child{width:42px;text-align:right}

/* --- Starter : cartes lisibles, sélection au contraste correct --- */
.starter .stgrid{grid-template-columns:repeat(3,1fr);gap:14px}
.starter .stcard{min-height:196px;justify-content:center;gap:6px}
.starter .stcard img{width:76px;height:76px;object-fit:contain;image-rendering:pixelated}
.starter .stcard.sel{background:color-mix(in srgb,var(--pw-accent) 16%,var(--pw-bg-surface));
  border-color:var(--pw-accent);color:var(--pw-text-primary)}
.starter .stcard.sel .nn,.starter .stcard.sel .nn2{color:var(--pw-text-primary)}
.starter .go{display:flex;justify-content:center;width:min(100%,520px)}
.starter .go .btn{flex:1;max-width:280px;height:44px}

/* --- v10c : proportions du combat et du bandeau d'équipe --- */
.bbox .hpstack{height:9px}
.bmv .mv{height:26px}
.tband .bmv .mv{height:26px}
.bwild .bbox .bmv .mv{height:24px}

/* v10d — Equipe et Combat alignes sur la grammaire relevee :
   carte SABLE (--light1) + boites internes SOMBRES (--dark1/--dark2),
   item tenu 1,6x dans l'angle, sprite large ancre en bas. */
.tband{background:var(--light1);border:1px solid var(--dark1);border-radius:10px;
  padding:10px;gap:8px;overflow:hidden}
.tband .tspr{width:96px;height:104px;flex:0 0 96px;align-items:flex-end}
.tband .tspr img{width:92px;height:92px;transform-origin:center bottom}
.tband .hitem{left:0;top:0;width:auto;height:auto;background:transparent;border:0;
  border-radius:0;display:block;padding:0}
.tband .hitem img{width:24px;height:24px;transform:scale(1.6);transform-origin:top left;
  border-radius:0 0 8px 0;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.tband .hitem svg{color:var(--dark1);opacity:.5;margin:4px}
.tband .slotno{left:10px;bottom:4px;color:var(--dark1);opacity:.45}
.tband .nmrow{color:var(--dark1)}
.tband .nmrow .lvl{background:var(--dark2);color:var(--light2)}
.tband .bmv{background:var(--dark1);border-radius:8px;padding:5px;gap:4px}
.tband.empty{background:color-mix(in srgb,var(--light1) 30%,var(--pw-bg-surface))}
.bme{background:var(--light1);border:1px solid var(--dark1);padding:10px;gap:10px}
.bme .bbox{background:var(--dark1);border-radius:8px;padding:7px;color:var(--light2)}
.bme .bbox .nmrow{color:var(--light2)}
.bme .bbox .nmrow .lvl{background:var(--light1);color:var(--dark1)}
.bme .bbox .nmrow .hpnum{color:var(--light2);opacity:.75}
.bme .bflair{background:color-mix(in srgb,var(--dark1) 25%,transparent)}
.bme .bflair .bspr{width:96px;height:96px}

/* --- v10e : le Guide sait d'où il a été ouvert --- */
.ctx{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--pw-text-secondary);
  padding:6px 10px;margin-bottom:8px;border-radius:9px;
  border:1px solid color-mix(in srgb,var(--pw-accent) 40%,var(--pw-border-color));
  background:color-mix(in srgb,var(--pw-accent) 8%,var(--pw-bg-header))}
.ctx b{color:var(--pw-text-primary)}

/* ===================================================================
   v11 — Équipe / Combat : structure recopiée du jeu réel
   (capture `chill-real-combat-team.png` + .explore-team-member /
    .explore-header-hpbox / .pkmn-movebox / .team-held-item du dépôt)
   Un bandeau = carte sable + boîte d'info SOMBRE + barres de capacité.
   =================================================================== */
.tl{display:flex;flex-direction:column;gap:8px}

.tband{position:relative;display:flex;align-items:stretch;gap:0;padding:0;
  background:var(--light1);border:1px solid var(--dark1);border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tband .tspr{width:120px;height:122px;flex:0 0 120px;display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:2px}
.tband .tspr img{width:112px;height:112px;object-fit:contain;image-rendering:pixelated;
  transform-origin:center bottom;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.tband .tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;
  padding:7px 9px 7px 2px;justify-content:center}
.tband .hpbox{background:var(--dark1);border-radius:6px;padding:5px 9px;
  display:flex;flex-direction:column;gap:4px;box-shadow:2px 2px 1px 2px rgba(0,0,0,.28)}
.tband .hpbox .nmrow{display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;font-weight:700}
.tband .hpbox .lvl{background:var(--light1);color:var(--dark1);font-size:10.5px;font-weight:800;
  padding:1px 6px;border-radius:4px;letter-spacing:.01em}
.tband .hpbox .hpnum{margin-left:auto;font-size:10px;color:#fff;opacity:.7}
.tband .bmv{display:flex;flex-direction:column;gap:5px}
.tband .hitem{position:absolute;left:0;top:0;z-index:5;width:26px;height:26px}
.tband .hitem img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;
  transform:scale(1.55);transform-origin:top left;border-radius:0 0 8px 0;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.tband .hitem svg{color:var(--dark1);opacity:.45;margin:5px}
.tband .slotno{position:absolute;left:9px;bottom:4px;z-index:5;font-size:10.5px;font-weight:800;
  color:var(--dark1);opacity:.45}
.tband.empty{background:color-mix(in srgb,var(--light1) 26%,var(--pw-bg-surface));opacity:.75}
.tband.empty .tspr{color:var(--pw-text-secondary)}
.tband.empty .tspr i{width:70px;height:70px;border:2px dashed var(--pw-border-color);border-radius:50%;
  display:block}

/* barre de capacité : exactement .pkmn-movebox */
.mv{position:relative;display:flex;align-items:center;height:30px;border-radius:6px;overflow:hidden;
  border:2px solid var(--pw-border-color);background:var(--dark1);color:#fff;
  padding-left:10px;font-size:12px;font-weight:600}
.mv .bar{position:absolute;inset:0 auto 0 0;opacity:.5}
.mv span{position:relative;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .ico{margin-left:auto;width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;
  justify-content:center;position:relative;z-index:2;color:#15130f}

/* --- barres PV / XP --- */
.hpstack{height:9px;border-radius:2px;background:#1b1916;overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.18)}
.hpstack i{position:absolute;top:0;bottom:0;left:0}
.hpstack .fill{background:#9BE08A}
.xpbar{height:6px;border-radius:2px;background:#1b1916;overflow:hidden;position:relative;margin-top:3px}
.xpbar i{position:absolute;top:0;bottom:0;left:0;background:#7cc8ee}

/* --- combat : panneau adverse et carte du combattant --- */
.bt{display:flex;flex-direction:column;gap:10px}
.bwild{position:relative;height:206px;border-radius:10px;overflow:hidden;
  border:1px solid var(--pw-border-color);background-size:cover;background-position:center}
.bwild .atk{position:absolute;left:8px;bottom:8px;font-size:9px;font-weight:800;letter-spacing:.06em;
  padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--pw-bg-page) 82%,transparent);
  color:#9FE8F0;border:1px solid #6FC9D6}
.bwild .bspr{position:absolute;left:16px;bottom:30px;width:104px;height:104px;object-fit:contain;
  image-rendering:pixelated;filter:drop-shadow(0 8px 8px rgba(0,0,0,.55))}
.bwild .epanel{position:absolute;right:8px;top:8px;width:min(66%,380px);padding:6px;
  display:flex;flex-direction:column;gap:5px;border-radius:10px;
  border:2px solid color-mix(in srgb,var(--light2) 72%,transparent);
  background:color-mix(in srgb,var(--pw-bg-page) 55%,transparent)}
.epanel .hpbox{background:var(--dark1);border-radius:6px;padding:5px 9px;display:flex;
  flex-direction:column;gap:4px}
.epanel .hpbox .nmrow{display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;font-weight:700}
.epanel .hpbox .lvl{background:var(--light1);color:var(--dark1);font-size:10.5px;font-weight:800;
  padding:1px 6px;border-radius:4px}
.epanel .hpbox .hpnum{margin-left:auto;font-size:10px;color:#fff;opacity:.7}
.epanel .bmv{display:flex;flex-direction:column;gap:5px}

.bme{position:relative;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;
  background:var(--light1);border:2px solid color-mix(in srgb,var(--light2) 80%,var(--dark1));overflow:hidden}
.bme .bflair{position:relative;width:118px;height:118px;flex:0 0 118px;border-radius:50%;
  background:color-mix(in srgb,var(--dark1) 28%,transparent);display:grid;place-items:center}
.bme .bflair .bspr{width:100px;height:100px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.bme .bbox{flex:1;min-width:0;background:var(--dark1);border-radius:6px;padding:6px 9px;
  display:flex;flex-direction:column;gap:5px}
.bme .bbox .nmrow{display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;font-weight:700}
.bme .bbox .lvl{background:var(--light1);color:var(--dark1);font-size:10.5px;font-weight:800;
  padding:1px 6px;border-radius:4px}
.bme .bbox .hpnum{margin-left:auto;font-size:10px;color:#fff;opacity:.7}
.bme .bmv{display:flex;flex-direction:column;gap:5px;margin-top:1px}

/* réservistes : mêmes bandeaux, version sombre compacte */
.brsv{display:flex;flex-direction:column;gap:6px}
.brsv .row{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;
  background:var(--dark2);border:1px solid var(--dark1)}
.brsv .row img{width:46px;height:46px;object-fit:contain;image-rendering:pixelated;flex:0 0 46px}
.brsv .row .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.brsv .row .nmrow{display:flex;align-items:center;gap:7px;color:#fff;font-size:12px;font-weight:700}
.brsv .row .lvl{background:var(--light1);color:var(--dark1);font-size:9.5px;font-weight:800;
  padding:1px 5px;border-radius:4px}

/* --- fin de la duplication d'en-tête : le titre ne vit que dans l'en-tête --- */
.teamsel{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:7px;background:var(--pw-bg-header);
  border:1px solid var(--pw-border-color);color:var(--pw-text-primary)}
.win-h .acts .hb.sq{width:22px;height:22px}

/* --- v11c : l'en-tête de fenêtre absorbe sélecteur + actions sans se tasser --- */
.win-h{overflow:hidden}
.win-h > span:first-of-type{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-h .r{display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap;
  font-size:11px;color:var(--pw-text-secondary)}
.win-h .r .teamsel{font-size:10.5px;padding:2px 7px}
.win-h .acts{flex:0 0 auto}

/* ===================================================================
   v12 — en-têtes sobres (titre + « ? »), sélecteur d'équipe sous l'en-tête,
   combat : butin + résumé + emblème animé + objets tenus visibles.
   =================================================================== */
/* 1. Barre de contexte sous l'en-tête (sélecteur de preset) */
.teambar{display:flex;align-items:center;gap:6px;margin:0 0 9px}
.teambar .teamsel{height:28px}
.teambar .hb.sq{width:28px;height:28px}
.teambar::after{content:'';flex:1}

/* 2. Emblème animé du Pokémon actif (équivalent de la Poké Ball PokéChill) */
.actif{position:absolute;left:8px;top:8px;z-index:6;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:color-mix(in srgb,var(--pw-bg-page) 55%,transparent);
  border:1.5px solid color-mix(in srgb,var(--pw-accent) 70%,transparent)}
.actif svg{width:18px;height:18px;animation:pwspin 3.4s linear infinite;color:var(--pw-accent)}
@keyframes pwspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* 3. Objets tenus visibles en combat (même pose que dans l'équipe) */
.bme .hitem{position:absolute;left:0;top:0;z-index:7;width:26px;height:26px}
.bme .hitem img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;
  transform:scale(1.55);transform-origin:top left;border-radius:0 0 8px 0;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.brsv .row .hitem{margin-left:2px;display:flex;align-items:center;color:var(--pw-text-secondary)}
.brsv .row .hitem img{width:20px;height:20px;object-fit:contain;image-rendering:pixelated}

/* 4. Butin + rangée d'actions de fin de combat */
.bloot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header)}
.bloot .lb{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--pw-text-secondary)}
.bloot .drops{display:flex;gap:6px;margin-left:auto}
.btend{display:flex;gap:8px}
.btend .btn{flex:1}

/* --- v12c : le combat tient dans la fenêtre (butin + résumé visibles d'emblée) --- */
.bwild{height:186px}
.bme{padding:7px 9px}
.bme .bflair{width:104px;height:104px;flex:0 0 104px}
.bme .bflair .bspr{width:88px;height:88px}
.bmv .mv{height:28px}
.brsv .row{padding:5px 8px}
.brsv .row img{width:40px;height:40px;flex:0 0 40px}
.bloot{padding:6px 9px}
.btend .btn{height:36px}
/* l'objet tenu ne se superpose plus à l'emblème du Pokémon actif */
.bme .hitem{left:auto;right:0;top:0}
.bme .hitem img{transform-origin:top right;border-radius:0 0 0 8px}

/* --- v12d : le combat complet tient dans la fenêtre --- */
.bwild{height:170px}
.bwild .bspr{width:92px;height:92px;bottom:26px}
.bmv .mv{height:27px}
.brsv .row{padding:4px 8px;gap:7px}
.brsv .row img{width:36px;height:36px;flex:0 0 36px}
.brsv .row .xpbar{height:5px}
.bloot{padding:5px 9px}
.btend .btn{height:36px}
/* objet tenu dans la ligne du nom (combat) */
.nmrow .hitem{width:auto;height:auto;position:static;display:flex;align-items:center}
.nmrow .hitem img{width:20px;height:20px;object-fit:contain;image-rendering:pixelated;
  transform:none;border-radius:4px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.nmrow .hitem svg{color:#fff;opacity:.35}

/* ===================================================================
   v13 — Combat : le fond animé est la Poké Ball grisée du jeu
   (.explore-team-member-flair : grand rond, opacité .3, rotation lente),
   l'objet tenu reprend l'angle, plus de rond derrière le sprite.
   =================================================================== */
.bme{position:relative;overflow:hidden;padding:9px 11px;gap:10px}
.bme .flair{position:absolute;left:-58px;top:-62px;width:250px;height:250px;z-index:0;
  opacity:.22;color:var(--dark1);animation:pwspin 26s linear infinite;pointer-events:none}
.bme .flair svg{width:100%;height:100%}
.bme .bflair{position:relative;z-index:1;width:150px;height:150px;flex:0 0 150px;background:none;
  display:grid;place-items:center;border-radius:0}
.bme .bflair .bspr{width:150px;height:150px}
.bme .bbox{position:relative;z-index:1}
.bme .hitem{position:absolute;left:0;top:0;z-index:7;width:26px;height:26px}
.bme .hitem img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;
  transform:scale(1.55);transform-origin:top left;border-radius:0 0 8px 0;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.nmrow .hitem{display:none}
.bwild{height:206px}
.bwild .bspr{width:132px;height:132px;left:14px;bottom:24px}
@keyframes pwspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* corrige la grille posée en v10b (sélecteur plus fort) */
.starter .stgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
/* ===================================================================
   v13 — Choix du starter : contenu réel du jeu (accueil, sous-titre,
   pseudo obligatoire, trois cartes, mention + Retour). Plein cadre.
   =================================================================== */
.starter{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:22px;
  background:var(--pw-bg-page);overflow:auto}
.stwrap{width:min(100%,880px);display:flex;flex-direction:column;align-items:center;
  gap:9px;text-align:center}
.stwelcome{font-size:11.5px;color:var(--pw-text-secondary)}
.sttitle{margin:0;font-size:22px;font-weight:800}
.stsub{font-size:12px;color:var(--pw-text-secondary);max-width:560px;line-height:1.45}
.stname{display:flex;align-items:center;gap:9px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.stname span{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--pw-text-secondary)}
.stname input{width:min(280px,60vw);height:36px;border-radius:9px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);
  color:var(--pw-text-primary);padding:0 12px;font:inherit;font-size:13px;text-align:center}
.stname input:focus{outline:2px solid var(--pw-accent);outline-offset:1px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;
  width:100%;margin-top:4px}
.stcard{display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 12px;
  border-radius:12px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header);
  cursor:pointer;transition:.15s}
.stcard:hover{border-color:var(--pw-accent);transform:translateY(-2px)}
.stcard img{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}
.stcard .nn{font-size:15px;font-weight:800;letter-spacing:.01em}
.stcard .nn2{font-size:10.5px;color:var(--pw-text-secondary)}
.stcard .desc{font-size:10.5px;color:var(--pw-text-secondary);line-height:1.35;min-height:28px}
.stcard .pick{margin-top:4px;font-size:10px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--pw-accent)}
.stcard.sel{border-color:var(--pw-accent);
  background:color-mix(in srgb,var(--pw-accent) 10%,var(--pw-bg-header))}
.stfoot{font-size:11px;color:var(--pw-text-secondary);margin-top:2px}
.stback{margin-top:4px}

/* --- v13b : tout le combat tient dans la fenêtre, butin et actions sur une ligne --- */
.bwild{height:190px}
.bwild .bspr{width:124px;height:124px;bottom:22px}
.bme .bflair{width:126px;height:126px;flex:0 0 126px}
.bme .bflair .bspr{width:126px;height:126px}
.bme .bbox .nmrow{white-space:nowrap;overflow:hidden;font-size:12.5px;gap:5px}
.brsv .row{padding:3px 8px;gap:6px}
.brsv .row img{width:34px;height:34px;flex:0 0 34px}
.brsv .row .hpstack{height:7px}
.brsv .row .xpbar{height:4px;margin-top:2px}
.brsv .row .nmrow{font-size:11.5px}
.btend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btend .bloot{flex:1 1 150px}
.btend .btn{flex:0 1 auto;height:36px;padding:0 14px;white-space:nowrap}

/* --- v14 : la plaque du lieu passe en haut, centrée et lisible --- */
.loc-hero .plate{left:50%;top:9px;bottom:auto;transform:translateX(-50%);
  font-size:15px;font-weight:800;letter-spacing:.02em;padding:5px 16px;border-radius:9px;
  background:color-mix(in srgb,var(--pw-bg-header) 88%,transparent);
  text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* --- v14 : combat, les deux bandeaux ont exactement la même géométrie --- */
.bwild{height:auto;border-radius:10px;overflow:hidden;position:relative;display:block;
  border:2px solid color-mix(in srgb,var(--light2) 80%,var(--dark1))}
.bwild .bcard{display:flex;align-items:center;gap:10px;padding:9px 11px;position:relative;z-index:2}
.bwild .bflair{width:126px;height:126px;flex:0 0 126px;display:grid;place-items:center}
.bwild .bflair .bspr{position:static;width:126px;height:126px;object-fit:contain;
  image-rendering:pixelated;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.bwild .bbox{flex:1;min-width:0;background:var(--dark1);border-radius:6px;padding:6px 9px;
  display:flex;flex-direction:column;gap:5px;position:relative;z-index:2}
.bwild .bbox .nmrow{display:flex;align-items:center;gap:5px;color:#fff;font-size:12.5px;font-weight:700;
  white-space:nowrap;overflow:hidden}
.bwild .bbox .lvl{background:var(--light1);color:var(--dark1);font-size:10.5px;font-weight:800;
  padding:1px 6px;border-radius:4px}
.bwild .bbox .hpnum{margin-left:auto;font-size:10px;color:#fff;opacity:.7}
.bwild .bbox .mv{background:var(--dark1)}
.bwild .atk{z-index:3}
.mv.empty{background:color-mix(in srgb,var(--dark1) 70%,var(--pw-bg-page));
  border-color:color-mix(in srgb,var(--light1) 35%,var(--pw-border-color))}

/* ===================================================================
   v15 — Choix du starter : cartes claires à bordure pointillée, titre sur
   bandeau clair, fond sombre translucide — relevé de #starter-menu et
   .starter-list du dépôt PokéChill.
   =================================================================== */
.starter{display:flex;align-items:center;justify-content:center;padding:26px;
  background:radial-gradient(120% 90% at 50% 0%,#1b1e18 0%,#0c0d0b 70%),var(--pw-bg-page)}
.stwrap{gap:14px;max-width:840px}
.stwelcome{font-size:11.5px;color:var(--light1);opacity:.85}
.sttitle{margin:0;font-size:19px;font-weight:800;color:var(--dark1);
  background:var(--light2);padding:5px 34px;border-radius:6px;
  box-shadow:0 3px 0 rgba(0,0,0,.35)}
.stsub{font-size:12px;color:var(--light1);opacity:.8;max-width:520px;line-height:1.5}
/* nom du dresseur : intitulé au-dessus, champ en dessous */
.stname{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 6px}
.stname span{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--light1);opacity:.85}
.stname input{width:min(300px,72vw);height:38px;border-radius:8px;
  border:2px solid var(--light1);background:var(--light2);color:var(--dark1);
  padding:0 12px;font:inherit;font-size:13.5px;text-align:center;font-weight:700}
.stname input::placeholder{color:color-mix(in srgb,var(--dark1) 45%,transparent)}
.stname input:focus{outline:3px solid var(--pw-accent);outline-offset:2px}
/* cartes : claires, bordure pointillée + liseré, comme .starter-list div */
.starter .stgrid{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:18px}
.stcard{background:var(--light2);color:var(--dark1);border:3px dashed var(--light1);
  outline:3px solid var(--light2);outline-offset:0;border-radius:8px;padding:12px 10px 10px;
  transition:.2s}
.stcard:hover{transform:scale(1.05)}
.stcard:active{transform:scale(.98)}
.stcard img{width:104px;height:104px}
.stcard .nn{font-size:15px;font-weight:800;color:var(--dark1)}
.stcard .nn2{font-size:10.5px;color:color-mix(in srgb,var(--dark1) 60%,transparent)}
.stcard .desc{font-size:10.5px;line-height:1.35;color:color-mix(in srgb,var(--dark1) 78%,transparent);
  min-height:30px}
.stcard .pick{margin-top:5px;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dark1);background:var(--pw-accent);
  padding:3px 12px;border-radius:5px}
.stcard.sel{outline-color:var(--pw-accent);border-color:color-mix(in srgb,var(--dark1) 45%,transparent)}
.stfoot{font-size:10.5px;color:var(--light1);opacity:.7}

/* --- v15b : corrections de mise en page du starter --- */
.starter{display:block;overflow-y:auto;overflow-x:hidden;padding:26px 22px 34px}
.starter .stwrap{width:100%;max-width:840px;margin:auto;display:flex;flex-direction:column;
  align-items:center;gap:12px;flex:0 0 auto}
.starter .stgrid{width:100%;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.starter .stcard.sel{background:var(--light2);outline:3px solid var(--pw-accent);
  border-color:color-mix(in srgb,var(--dark1) 45%,transparent);transform:translateY(-2px)}
.starter .stcard.sel .nn,.starter .stcard.sel .nn2,.starter .stcard.sel .desc{color:var(--dark1)}
.starter .stcard.sel .nn2,.starter .stcard.sel .desc{color:color-mix(in srgb,var(--dark1) 70%,transparent)}
/* ===================================================================
   v16 — corrections ciblees du retour sur v14/v15.
   1. Combat : une case d'attaque vide fait EXACTEMENT la taille d'une case
      pleine (`.empty` heritait du padding global de 26px qui la gonflait).
   2. Combat : la carte adverse reprend la geometrie de la notre — la boite
      d'info restait positionnee en absolu, ses `inset` la decalaient de 10px.
   3. Lieu : plaque centree sur l'image, fond OPAQUE (lisible sur tout decor).
   4. Starter : textes de la DA (sable adouci, encre tiede), fond texture
      pour ne plus etre un aplat vide.
   =================================================================== */

/* --- 1. les quatre emplacements sont interchangeables --- */
.mv{height:27px}
.mv.empty{padding:0;padding-left:0;min-height:0;height:27px}
.bwild .bbox .bmv .mv{height:27px}
.bwild .bbox .bmv .mv.empty{padding:0}

/* --- 2. meme cadre, meme sprite, meme boite des deux cotes --- */
.bmv{gap:5px}
.bwild .bbox .bmv{gap:5px;margin-top:1px}
.bwild .bcard{gap:10px;padding:9px 11px;align-items:center}
.bwild .bflair{position:relative;inset:auto;flex:0 0 126px}
.bwild .bbox{position:relative;inset:auto;top:auto;right:auto;bottom:auto;left:auto;
  flex:1;min-width:0;padding:6px 9px;background:var(--dark1);border:0}

/* --- 3. plaque du lieu : centree, opaque, toujours lisible --- */
.loc-hero .plate{background:var(--pw-bg-header);color:var(--light2);
  border:1px solid color-mix(in srgb,var(--light1) 48%,var(--pw-border-color));
  box-shadow:0 2px 7px rgba(0,0,0,.5);text-shadow:none}

/* --- 4a. fond du starter : relief + trame discrete au lieu d'un aplat --- */
.starter{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;
  overflow-y:auto;overflow-x:hidden;padding:26px 22px 30px;
  background:
  radial-gradient(118% 82% at 50% -10%, color-mix(in srgb,var(--light1) 22%,var(--pw-bg-page)) 0%, transparent 58%),
  radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--light1) 9%,transparent) 0 1px, transparent 1px) 0 0/15px 15px,
  repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
  radial-gradient(120% 96% at 50% 112%, rgba(0,0,0,.5) 0%, transparent 62%),
  var(--pw-bg-page)}

/* --- 4b. textes : sable adouci + encre tiede, plus de noir sur blanc --- */
.sttitle{background:var(--light1);color:color-mix(in srgb,var(--dark1) 94%,var(--light1))}
.stname span{color:color-mix(in srgb,var(--light1) 82%,var(--pw-bg-page));opacity:1}
.stname input{background:color-mix(in srgb,var(--dark2) 78%,var(--pw-bg-page));
  color:var(--light2);border:2px solid color-mix(in srgb,var(--light1) 52%,transparent);
  font-weight:600}
.stname input::placeholder{color:color-mix(in srgb,var(--light1) 55%,transparent)}
.stcard{background:var(--light1);
  border:3px dashed color-mix(in srgb,var(--dark1) 52%,var(--light1));
  outline:3px solid color-mix(in srgb,var(--light1) 62%,var(--pw-bg-page));
  color:color-mix(in srgb,var(--dark1) 94%,var(--light1))}
.stcard .nn{color:color-mix(in srgb,var(--dark1) 95%,var(--light1))}
.stcard .nn2{color:color-mix(in srgb,var(--dark1) 74%,var(--light1))}
.stcard .desc{color:color-mix(in srgb,var(--dark1) 82%,var(--light1))}
.stcard .pick{color:var(--light2);background:color-mix(in srgb,var(--dark1) 90%,#000);
  border:1px solid color-mix(in srgb,var(--light1) 38%,transparent)}
.starter .stcard.sel{background:var(--light2);
  outline-color:var(--pw-accent);
  border-color:color-mix(in srgb,var(--dark1) 45%,var(--light1))}
.starter .stcard.sel .nn,.starter .stcard.sel .nn2,.starter .stcard.sel .desc{color:color-mix(in srgb,var(--dark1) 90%,var(--light2))}
/* ===================================================================
   v17 — deux retours cibles.
   1. Combat : le butin reprend sa propre ligne pleine largeur et les deux
      actions passent en dessous, cote a cote. Les trois blocs ne partagent
      plus une seule ligne.
   2. Lieu : la plaque du nom est centree sur le decor avec un fond
      legerement translucide — on voit le paysage au travers.
   =================================================================== */
.btend{display:flex;flex-direction:column;gap:7px;align-items:stretch}
.btend .bloot{width:100%;flex:none;padding:4px 9px}
.btend .bacts{display:flex;gap:8px}
.btend .bacts .btn{flex:1;height:32px;padding:0 14px;white-space:nowrap}
/* le butin reste compact : la fenetre continue de tenir sans scroll interne */
.btend .bloot .drops{padding:0}
.btend .bloot .drop{width:30px;height:30px;border-radius:7px}
.btend .bloot .drop img{width:24px;height:24px}
.btend .bloot .drop .q{font-size:8px;padding:0 3px;bottom:-3px;right:-3px}
.bt{gap:7px}

.loc-hero .plate{background:color-mix(in srgb, var(--pw-bg-header) 72%, transparent);
  border:1px solid color-mix(in srgb, var(--light1) 55%, transparent);
  box-shadow:0 2px 8px rgba(0,0,0,.45);text-shadow:0 1px 3px rgba(0,0,0,.75)}
/* ===================================================================
   v18 — retours du 2026-11-08.
   1. Lieu : la plaque du nom est centree horizontalement ET verticalement
      sur le decor.
   2. La fenetre qui depasse la hauteur de l'ecran n'est plus tranchee :
      c'est le cadre qui defile, comme la page du jeu, pas le panneau.
   3. Starter mobile : cartes compactes de la largeur de leur contenu,
      centrees et qui s'enroulent (grammaire .starter-list de PokeChill),
      au lieu de cartes pleine largeur avec un sprite de 104 px.
   =================================================================== */
.loc-hero .plate{top:50%;bottom:auto;transform:translate(-50%,-50%)}

.frame.pc, .frame.tablet, .frame.mobile{overflow-y:auto;overflow-x:hidden}
.frame .topb{position:sticky;top:0;z-index:6}
.frame .dash{overflow:visible}

.frame.mobile .starter{padding:18px 14px 24px}
.frame.mobile .starter .stwrap{gap:10px}
.frame.mobile .sttitle{font-size:17px;padding:4px 22px}
.frame.mobile .stgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.frame.mobile .stcard{flex:0 1 auto;width:auto;max-width:44%;min-height:0;padding:10px 10px 9px;gap:3px}
.frame.mobile .stcard img{width:60px;height:60px}
.frame.mobile .stcard .nn{font-size:13px}
.frame.mobile .stcard .nn2{font-size:9.5px}
.frame.mobile .stcard .desc{font-size:9.5px;min-height:0;max-width:140px;line-height:1.25}
.frame.mobile .stcard .pick{font-size:9.5px;padding:3px 10px;margin-top:4px}
.frame.mobile .stname{margin:2px 0 0}
.frame.mobile .stname input{height:34px}
/* ---------------------------------------------------------------------------
   Lot C — Sac, Pokédex, Boutique, Marché, Badges, Dictionnaire, Atoll, Succès
   Une brique par concept, parametrée par les données : aucune taille, couleur
   ou libellé propre à un seul écran.
   ------------------------------------------------------------------------- */
.lc-av{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:var(--pw-bg-sprite);
  border:1px solid var(--pw-border-color);color:var(--pw-text-primary);
  display:flex;align-items:center;justify-content:center;position:relative}
.lc-av img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated}
.lc-av.sprite{background:var(--pw-bg-sprite)}
.lc-av.sprite > img{width:32px;height:32px}
.lc-av .ball{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;object-fit:contain}
.lc-wal{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 11px;border-radius:9px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header)}
.lc-wal .w{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--pw-accent)}
.lc-wal .w .lab{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--pw-text-secondary)}
.lc-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;padding:8px;
  border-radius:10px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header)}
.lc-foot .mini{padding:6px 9px;border-radius:7px;border:1px solid var(--pw-border-color);
  background:var(--pw-bg-surface);font-size:10.5px;font-weight:700;color:var(--pw-text-primary)}
.lc-foot .qty{width:54px;text-align:center;padding:6px 2px;border-radius:7px;font-size:12px;font-weight:800;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-surface);color:var(--pw-text-primary)}
.lc-foot .tot{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  color:var(--pw-accent)}
.lc-offers{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container (min-width:520px){.lc-offers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lc-offer{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 5px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);text-align:center}
.lc-offer.on{border-color:var(--pw-accent);box-shadow:inset 0 0 0 1px var(--pw-accent)}
.lc-offer .ic{width:40px;height:40px;border-radius:9px;background:var(--pw-bg-sprite);
  border:1px solid var(--pw-border-color);color:var(--pw-text-primary);
  display:flex;align-items:center;justify-content:center}
.lc-offer .ic img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}
.lc-offer .nm{font-size:10.5px;font-weight:700;line-height:1.15}
.lc-offer .pr{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--pw-accent)}
.lc-offer .st{font-size:9.5px;color:var(--pw-text-secondary);line-height:1.2}
.lc-rp{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:7px 10px;
  border-radius:9px;border:1px solid var(--pw-border-color);background:var(--pw-bg-header);margin-bottom:7px}
.lc-rp .r{margin-left:auto;font-size:10px;font-weight:600;color:var(--pw-text-secondary)}
.lc-badges{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container (min-width:520px){.lc-badges{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lc-badge{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 5px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);text-align:center}
.lc-badge.on{border-color:color-mix(in srgb,var(--pw-accent) 55%,var(--pw-border-color))}
.lc-badge.off{opacity:.45}
.lc-badge .medal{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--mc,var(--pw-accent)) 22%,var(--pw-bg-sprite));
  border:1px solid color-mix(in srgb,var(--mc,var(--pw-accent)) 55%,transparent);color:var(--mc,var(--pw-accent))}
.lc-badge .n{font-size:10.5px;font-weight:800;line-height:1.15}
.lc-badge .who{font-size:9.5px;color:var(--pw-text-secondary);line-height:1.2}
.lc-badge .st{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  color:var(--pw-text-secondary)}
.lc-badge.on .st{color:var(--ok)}
.lc-hero{display:flex;align-items:center;gap:12px;padding:11px;border-radius:11px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);margin-bottom:9px}
.lc-hero h2{margin:0;font-size:13px;font-weight:800}
.lc-hero p{margin:3px 0 0;font-size:10.5px;line-height:1.35;color:var(--pw-text-secondary)}
.lc-hero .tokens{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:7px 11px;border-radius:10px;background:color-mix(in srgb,var(--pw-accent) 12%,var(--pw-bg-surface));
  border:1px solid color-mix(in srgb,var(--pw-accent) 40%,transparent)}
.lc-hero .tokens b{font-size:15px;font-weight:800;color:var(--pw-accent)}
.lc-hero .tokens span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--pw-text-secondary)}
.lc-hero .tokens small{font-size:9px;color:var(--pw-text-secondary)}
.lc-hub{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:9px}
@container (min-width:520px){.lc-hub{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lc-hubcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);text-align:center}
.lc-hubcard .ic{color:var(--pw-accent);display:flex}
.lc-hubcard .n{font-size:11px;font-weight:800}
.lc-hubcard .s{font-size:9.5px;color:var(--pw-text-secondary);line-height:1.2}
.lc-mode{display:flex;gap:9px;align-items:center;padding:9px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);margin-bottom:6px}
.lc-rank{font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-sprite);color:var(--pw-text-secondary)}
.lc-rank.up{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.lc-bonus{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:9px}
.lc-bonuscard{display:flex;flex-direction:row;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;
  border:1px solid var(--pw-border-color);background:var(--pw-bg-header);text-align:center}
.lc-bonuscard b{font-size:13px;font-weight:800;color:var(--ok)}
.lc-bonuscard span{font-size:9px;color:var(--pw-text-secondary);line-height:1.2}
.lc-tiers{display:inline-flex;gap:3px}
.lc-tiers i{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--light1) 28%,transparent)}
.lc-tiers i.on{background:var(--pw-accent)}

/* Les memes briques, une fois la colonne etroite (mobile) : rien ne se comprime. */
@container (max-width:429px){
.lc-rp{flex-wrap:wrap;row-gap:3px}
.lc-rp .r{margin-left:0;width:100%}
.lc-hero{flex-wrap:wrap}
.lc-hero .tokens{margin-left:0;width:100%}
.lc-foot{gap:5px}
.lc-foot .tot{margin-left:0;width:100%;justify-content:flex-end}
}
/* ===========================================================================
   Lot C — une seule grammaire : celle de la fenetre Lieu.
   Une page pleine est une fenetre (.win) ; un selecteur est un .segx ; un filtre
   est un <select> ; une cellule a exactement la matiere d'une .row.
   Aucune couleur en dur, aucune taille inventee.
   =========================================================================== */

/* 1. Une pleine page EST une fenetre du jeu : meme fond, meme bord, meme en-tete. */
.fs{flex:1 1 auto;width:100%;min-width:0;align-self:stretch;margin:10px;
  background:var(--pw-bg-surface);border:1px solid var(--pw-border-color);
  border-radius:var(--radius);overflow:hidden}
.frame.mobile .fs{margin:0;border-radius:0;border-left:0;border-right:0}
.fs-b{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.frame.mobile .fs{height:auto;min-height:100%;overflow:visible}
.frame.mobile .fs-b{overflow:visible;flex:0 0 auto}
.fs-back{width:26px;height:26px;flex:0 0 26px;margin-left:-4px;display:flex;align-items:center;
  justify-content:center;border-radius:50%;border:1px solid var(--pw-border-color);
  background:transparent;color:var(--pw-text-primary)}
.frame.mobile .fs-back{display:none}

/* 2. Selecteur de categorie / de page : la barre du sac PokeChill. */
.segx{display:grid;gap:5px;grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}
.segx .s{height:36px;display:flex;align-items:center;justify-content:center;padding:0 8px;
  border-radius:18px;background:var(--dark2);color:var(--light2);
  font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segx .s.on{background:var(--light1);color:var(--pw-bg-header)}

/* 3. Filtres : les listes deroulantes du Pokedex PokeChill. */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0}
.filters .t{font-size:13px;font-weight:700;color:var(--light2)}
.filters .sep{width:100%;height:1px;margin:2px 0;
  background:color-mix(in srgb,var(--light1) 40%,transparent)}
.filters select{height:28px;max-width:100%;border:0;border-radius:999px;
  background:var(--dark2);color:var(--light2);font:inherit;font-size:12px;padding:0 10px}
.filters .clr{display:flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:999px;background:var(--dark2);color:var(--light2)}
.srch{flex:0 0 auto;width:100%;min-height:34px}

/* 4. Cellules : la matiere du vertical layout de Lieu (.row), en grille. */
.cards{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));align-items:stretch}
.gcell{display:flex;flex-direction:column;overflow:hidden;border-radius:10px;
  background:var(--dark2);border:1px solid transparent;text-align:center}
.gcell .ic{position:relative;height:58px;display:flex;align-items:center;justify-content:center}
.gcell .ic img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}
.gcell .nm{display:block;width:100%;min-width:0;background:var(--light1);color:var(--pw-bg-header);
  font-size:11.5px;font-weight:700;line-height:1.15;padding:4px 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcell .pr{display:flex;align-items:center;justify-content:center;gap:3px;padding:3px 2px 0;
  font-size:11px;font-weight:800;color:var(--light2)}
.gcell .sub{padding:1px 3px 4px;font-size:10.5px;color:var(--light1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcell .shy{position:absolute;right:4px;top:4px;width:14px;height:14px;border-radius:50%;
  background:var(--pw-accent);color:var(--pw-text-on-accent);display:flex;align-items:center;justify-content:center}
.gcell.sel{border-color:var(--light1);background:var(--dark3);box-shadow:0 0 0 1px var(--light1)}
.gcell.sel .nm{background:var(--light1);color:var(--pw-bg-header)}
.gcell.miss{opacity:.55}

/* 5. Bouton : le meme, en plus petit quand la ligne l'exige. */
.btn.sm{height:34px;font-size:12px;padding:0 10px}
.colgrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.row .a{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progrow{flex-wrap:nowrap;white-space:nowrap}
.progrow .prog{min-width:56px}
.chip{white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:6px}
.foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.foot .tot{margin-left:auto}

/* 8. Rangs : les couleurs du jeu (components/badges.css). */
.lc-rank.rank-gold{background:linear-gradient(135deg,rgb(255,215,0),rgb(218,165,32));
  color:rgb(40,30,0);border-color:transparent}
.lc-rank.rank-silver{background:linear-gradient(135deg,rgb(220,220,220),rgb(160,160,160));
  color:rgb(30,30,30);border-color:transparent}
.lc-rank.rank-bronze{background:linear-gradient(135deg,rgb(205,127,50),rgb(139,69,19));
  color:rgb(255,255,255);border-color:transparent}

/* 9. Etats et variantes, une seule fois. */
.row.dim{opacity:.55}
.moneyrow.four{grid-template-columns:repeat(4,1fr)}
.card .ic{position:relative}
.seclbl{margin:2px 2px 0}
@container (max-width:429px){
  .moneyrow.four{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .segx{grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}
  .fitgrid{grid-template-columns:repeat(auto-fit,minmax(124px,1fr))}
  .colgrid{grid-template-columns:1fr}
}


/* ============================================================================
   v25 — corrections demandees, une regle par point. Rien d'autre n'est touche.
   ============================================================================ */

/* 1. Sac : la liste du sac de PokeChill (#item-menu-list div) — rangee pleine largeur,
   rayon 999, fond --light1, icone puis nom, quantite a droite. Pas une grille de tuiles. */
.itemlist{display:flex;flex-direction:column;gap:5px}
.itemrow{display:flex;align-items:center;gap:9px;height:32px;padding:0 11px 0 7px;
  border-radius:999px;background:var(--light1);color:var(--pw-bg-header);
  font-size:12px;font-weight:700;overflow:hidden}
.itemrow img{width:22px;height:22px;object-fit:contain;image-rendering:pixelated;flex:0 0 22px}
.itemrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemrow .q{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

/* 2. Filtres : le fond de la pastille ne peut plus se confondre avec la surface de la
   fenetre dans les themes clairs. Meme forme, contraste garanti par la palette. */
.filters select{background:color-mix(in srgb,var(--pw-text-secondary) 20%,var(--pw-bg-surface));
  color:var(--pw-text-primary);
  border:1px solid color-mix(in srgb,var(--pw-text-secondary) 30%,transparent)}
.filters select option{background:var(--pw-bg-surface);color:var(--pw-text-primary)}
.filters .clr{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  width:auto;min-width:0;height:28px;padding:0 11px;border-radius:999px;
  background:color-mix(in srgb,var(--pw-text-secondary) 20%,var(--pw-bg-surface));
  color:var(--pw-text-primary);
  border:1px solid color-mix(in srgb,var(--pw-text-secondary) 30%,transparent);
  font-size:12px;font-weight:600}

/* 3. Succes : les bonus reprennent une carte sombre (fini le vert clair sur barre claire)
   et la recompense d'un succes descend sous sa barre, dans la colonne de texte : plus
   aucune pastille ne peut sortir de la carte. */
.bonusgrid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.bonuscard{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;
  background:var(--pw-bg-header);border:1px solid var(--pw-border-color)}
.bonuscard .ic{color:var(--ok);display:flex;flex:0 0 auto}
.bonuscard{min-width:0}
.bonuscard b{font-size:13px;font-weight:800;color:var(--pw-text-primary);white-space:nowrap}
.bonuscard .l{min-width:0;font-size:10.5px;color:var(--pw-text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rewline{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--pw-text-secondary)}
.colgrid .row{min-width:0;overflow:hidden}
.colgrid .row .tx{min-width:0}

/* v26 — Boutique / Marche : la cellule est celle du jeu (.pw-shop-item), copiee a l'identique.
   v26 — Sac : la pastille de PokeChill, mais en grille (minmax 180px -> 2 colonnes sur telephone).
   v26 — Boite PC : le niveau se pose au-dessus du cercle. */
.itemgrid{display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.shoplist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;
  border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)}
.shopitem:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22)}
.shopitem.sel{background:rgba(148,136,107,.22);border-color:var(--pw-accent);
  box-shadow:0 0 0 1px var(--pw-accent) inset}
.shopitem .ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.shopitem .ico img{max-width:34px;max-height:34px;object-fit:contain;image-rendering:pixelated}
.shopitem .nm{font-size:12px;color:var(--light1);text-align:center;line-height:1.15;
  min-height:28px;display:flex;align-items:center;justify-content:center}
.shopitem .pr{font-size:11px;color:var(--light2);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:4px}
.shopitem .st{font-size:11px;color:var(--pw-text-secondary)}
.cell .lvl{align-self:center;margin-bottom:2px}

/* v27 — Sac : les cases du Dictionnaire (.colgrid + .row). Quantite a droite, chiffres tabulaires.
   v27 — Boite PC : le niveau est une simple ligne de texte au-dessus du cercle, sans cadre.
   v27 — Marche : possede en vert, non possede en rouge. */
.row .qte{font-size:11px;font-weight:800;color:var(--pw-text-primary);font-variant-numeric:tabular-nums}
.cell .lvl{background:none;padding:0;font-size:10px;font-weight:700;color:var(--pw-text-secondary);
  letter-spacing:.02em}
.shopitem .st.ok{color:var(--ok)}
.shopitem .st.bad{color:var(--bad)}

/* v28 — tailles de sprite du jeu : objet 40px (--pw-item-icon-sm), Pokemon du Marche 72px
   (--pw-item-icon-lg). Le Pokedex n'affiche plus le niveau : il situe une collection. */
.shopitem .ico{width:40px;height:40px}
.shopitem .ico img{max-width:40px;max-height:40px}
.shopitem .ico.big{width:72px;height:72px}
.shopitem .ico.big img{max-width:72px;max-height:72px}

/* v29 — Menu de navigation : la Poké Ball de l'en-tête ouvre un panneau creme
   centre (grammaire PokéChill), fait de tuiles carrees : icone en haut, libelle
   dans une barre en bas. Une seule grille, pas de sections. */
.pokeball.on{box-shadow:0 0 0 2px color-mix(in srgb, var(--pw-accent) 55%, transparent);border-radius:50%}
.navscrim{position:absolute;inset:0;background:rgba(16,14,12,.6)}
/* Le panneau demarre exactement sous la Poké Ball de l'en-tete : meme bord gauche
   (10px), sous la barre de 48px. Il s'ouvre depuis le bouton, pas au centre. */
.navmenu{position:absolute;left:10px;top:56px;
  width:min(624px,calc(100% - 20px));max-height:calc(100% - 64px);overflow-y:auto;scrollbar-width:none;
  background:var(--light2);border-radius:var(--pw-window-radius);padding:10px 12px 12px;
  box-shadow:0 18px 40px rgba(0,0,0,.5)}
.navmenu::-webkit-scrollbar{display:none}
.navtiles{margin-top:0}

.navtiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.navtile{width:86px;height:86px;border-radius:8px;background:var(--light1);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.navtile .nt-i{display:flex;align-items:center;justify-content:center;flex:1;color:var(--dark2)}
.navtile .nt-n{display:flex;align-items:center;justify-content:center;width:100%;height:22px;padding:0 3px;
  background:var(--dark2);color:var(--light2);font-size:9.5px;font-weight:800;line-height:1;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* v30 — Plus de fleche retour a gauche : une croix a droite, dans tous les panneaux. */
.fs-back{display:none}
.win-h .fs-x{width:22px;height:22px;flex:0 0 22px;margin-left:6px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--pw-border-color);border-radius:50%;
  color:var(--pw-text-secondary)}
.win-h .r + .fs-x{margin-left:8px}
</style>
</head>

/* Barres de PV empilées : PV vert + bouclier + soin (grammaire PokéChill) */
const HpStack = ({hp, max, shield = 0, heal = 0, num = false}) => {
  const pct = Math.max(0, Math.min(100, (hp / max) * 100));
  const sh = Math.min(100 - pct, (shield / max) * 100);
  return `<div class="hpstack">
    <i class="fill" style="width:${pct}%"></i>
    ${shield ? `<i style="left:${pct}%;width:${sh}%;background:var(--shield)"></i>` : ''}
    ${heal ? `<i style="left:0;width:${(heal/max)*100}%;background:var(--heal)"></i>` : ''}
  </div>${num ? `<div style="font-size:10px;color:var(--pw-text-secondary);text-align:right">${hp} / ${max}</div>` : ''}`;
};

       <span>${esc(name)}</span>

};

/* --- documentation vivante : composants et nombre d’écrans qui les réutilisent --- */
function archBody() {
  const count = (name) => {
    const explicit = SCREENS.filter(s => (s.uses || []).includes(name)).length;
    if (name === 'TopBar') return SCREENS.length;
    if (name === 'NavBar') return SCREENS.filter(s => s.kind !== 'custom').length;
    if (name === 'Win') return SCREENS.filter(s => s.kind === 'win').length;
    if (name === 'Fullscreen') return SCREENS.filter(s => s.kind === 'fs').length;
    if (name === 'Sheet') return SCREENS.filter(s => s.kind === 'modal').length;
    if (name === 'Confirm') return SCREENS.filter(s => s.confirm).length;
    return explicit;
  };
  const rows = [['TopBar','barre supérieure (1 implémentation)'],['NavBar','onglets mobiles'],
    ['Win','fenêtre du tableau de bord'],['Fullscreen','panneau plein écran'],['Sheet','feuille modale'],
    ['Confirm','confirmation (texte = donnée)'],['Row','ligne de liste'],['MonCell','cellule Pokémon'],
    ['ItemCell','cellule objet'],['HpStack','barres PV / bouclier'],['MoveRow','ligne de capacité'],
    ['StatRow','ligne de statistique'],['Tabs','onglets'],['Chip','pastille'],['Btn','bouton']]
    .map(([n, d]) => `<div class="row"><div class="av">${svg('check',15)}</div>
      <div class="tx"><div class="a">${n}</div><div class="b2">${d}</div></div>
      <span class="chip">${count(n)} écran(s)</span></div>`).join('');
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div>
      <div class="seclbl" style="margin-top:0">Composants (${15}) et réutilisation</div>
      <div class="list">${rows}</div>
    </div>
    <div>
      <div class="seclbl" style="margin-top:0">Règles tenues par cette maquette</div>
      <div class="list">
        ${[['1 seule confirmation','Le starter, le relâchement, la relance, l’achat et l’abandon de combat utilisent le même composant : seuls les textes changent.'],
           ['1 seule feuille modale','28 modales = 1 composant + des données.'],
           ['0 couleur en dur','Tout passe par les variables de thème : les 10 thèmes se dérivent sans retoucher un composant.'],
           ['0 duplication PC / mobile','Le même contenu est rendu dans une fenêtre (PC) ou plein écran (mobile).'],
           ['Écrans = données','Chaque écran déclare un titre, un contenu et la liste des composants qu’il réutilise.']]
          .map(([t,d])=>`<div class="row"><div class="av">${svg('star',15)}</div>
            <div class="tx"><div class="a">${t}</div><div class="b2">${d}</div></div></div>`).join('')}
      </div>
      <div class="seclbl">Correspondance avec le jeu réel</div>
      <div class="list">
        ${[['Fenêtres','DashboardLayout.WindowIds (13) → DraggablePanel'],
           ['Plein écran','ModalIds.fs-* → UIFullscreenPanel'],
           ['Modales','config/ModalIds.js → UIModal / StaticModalPanel'],
           ['Win / Fullscreen','UIContainer + UIText + UIIcon'],
           ['Sheet / Confirm','ConfirmDialog.js (1 composant)'],
           ['Row / MonCell / ItemCell','UIContainer + UIImage + UIText'],
           ['HpStack / Dots / Stars','UIProgressBar / UIIcon'],
           ['MoveRow','PokemonMoveList + BattleCombatantCard'],
           ['Chip / Btn / Tabs','UIChip / UIButton / UITabBar']]
          .map(([t,d])=>`<div class="row"><div class="av">${svg('book',15)}</div>
            <div class="tx"><div class="a">${t}</div><div class="b2">${d}</div></div></div>`).join('')}
      </div>
    </div>
  </div>`;
}

   7. RENDU
   ========================================================================== */
const byId = Object.fromEntries(SCREENS.map(s => [s.id, s]));

/* Le « ? » de chaque en-tête ouvre le Guide, en gardant la trace de l'écran
   d'où l'on vient : le Guide se place donc toujours sur le bon contexte. */
var guideFocus = ''; /* var : lu par guideBody() dès la construction de SCREENS */
function openGuide(section) {
  const from = section || byId[current]?.guide || byId[current]?.label || '';
  guideFocus = from;
  current = 'guide';
  mode = 'single';
  render();
}

function winFor(scr) {
  return Win({title: scr.title || scr.label, icon: scr.icon || 'info', right: scr.right || '', body: scr.body});
}
function modalOverlay(scr, wide = false) {
  const sc = scr.blocking ? 'scrim opaque' : 'scrim';
  if (scr.confirm) {
    return `<div class="${sc}"></div>` + Confirm({...scr.confirm, className: wide ? 'pcmodal' : ''});
  }
  return `<div class="${sc}"></div>` + Sheet({title: scr.title, body: scr.body,
    actions: scr.actions || [{label:'Fermer', kind:'ghost'}], className: wide ? 'pcmodal' : ''});
}

function renderPC(scr) {
  if (scr.fullscreen) return `<div class="stage">${scr.body}</div>`;
  if (scr.id === 'architecture') return `<div class="stage">${TopBar()}
    <div style="flex:1;min-height:0;padding:12px;overflow:auto">
      <section class="win" style="height:100%"><header class="win-h">${svg('book',17)}<span>Architecture de la maquette</span></header>
      <div class="win-b">${archBody()}</div></section></div></div>`;
  if (scr.id === 'nav-menu') return `<div class="stage">${TopBar({navOpen:true})}
    <div class="dash" style="filter:brightness(.75)">
      <div class="col">${Win({ title:'Succès', icon:'trophy', body: achievementsBody() })}${Win({ title:'Poké Balls', icon:'box', body: pokeballsBody() })}</div>
      <div class="col">${Win({ title:'Monnaies', icon:'coin', body: currenciesBody() })}${Win({ title:'Carte : Kanto', icon:'map', body: mapBody() })}</div>
      <div class="col">${Win({ title:'Raccourcis', icon:'sparkle', body: shortcutsBody() })}${Win({ title:'Lieu', icon:'home', body: placeMini() })}</div>
    </div>${NavMenu()}</div>`;
  if (scr.id === 'dashboard') return dashboardPC();
  if (scr.id === 'save-menu') return saveMenu(false);
  if (scr.kind === 'win') {
    const body = scr.id === 'combat' ? battleBody(true) : scr.body;
    return PCShell({main: Win({title: scr.title || scr.label, icon: scr.icon || 'info', right: scr.right || '', body})});
  }
  if (scr.kind === 'modal') return PCShell({
    main: Win({title: scr.nav === 'combat' ? 'Combat en direct' : scr.nav === 'equipe' ? 'Équipe' : ZONE.name,
      icon: scr.nav === 'combat' ? 'sword' : 'home',
      body: scr.nav === 'combat' ? battleBody() : locationBody()}),
    overlay: modalOverlay(scr, true)});
  /* plein écran */
  return `<div class="stage">${TopBar()}<div style="flex:1;min-height:0;padding:10px;display:flex">
    ${Fullscreen({title: scr.title, body: scr.body, right: scr.right || ''})}</div></div>`;
}

function baseMobile(scr) {
  if (scr.nav === 'combat') return battleBody();
  if (scr.nav === 'equipe') return teamBody();
  return locationBody();
}

function renderMobile(scr) {
  if (scr.fullscreen) return `<div class="stage">${scr.body}</div>`;
  if (scr.id === 'architecture') return MobileShell({nav:'plus', body:`<div class="win" style="border:0;border-radius:0;min-height:100%">
    <header class="win-h">${svg('book',17)}<span>Architecture</span></header><div class="win-b">${archBody()}</div></div>`});
  if (scr.id === 'nav-menu') return `<div class="stage">${TopBar({navOpen:true})}
    <div class="dash" style="filter:brightness(.75)">
      <div class="col">${Win({ title:'Succès', icon:'trophy', body: achievementsBody() })}${Win({ title:'Poké Balls', icon:'box', body: pokeballsBody() })}</div>
      <div class="col">${Win({ title:'Monnaies', icon:'coin', body: currenciesBody() })}${Win({ title:'Carte : Kanto', icon:'map', body: mapBody() })}</div>
      <div class="col">${Win({ title:'Raccourcis', icon:'sparkle', body: shortcutsBody() })}${Win({ title:'Lieu', icon:'home', body: placeMini() })}</div>
    </div>${NavMenu()}</div>`;
  if (scr.id === 'dashboard') return dashboardPC();
  if (scr.id === 'save-menu') return saveMenu(true);
  if (scr.kind === 'win') return MobileShell({nav: scr.nav || 'lieu',
    /* min-height, jamais height : sur mobile la fenetre grandit avec son contenu et c'est le cadre
       qui defile. Avec height:100% le fond du panneau s'arretait a la hauteur du cadre et le bas
       du contenu (Lieu, Equipe...) reposait sur du vide. */
    body: `<div class="win" style="border:0;border-radius:0;min-height:100%">
             <header class="win-h">${svg(scr.icon || 'info', 17)}<span>${esc(scr.title || scr.label)}</span>
               ${scr.right ? `<span class="r">${scr.right}</span>` : ''}</header>
             <div class="win-b">${scr.body}</div></div>`});
  if (scr.kind === 'modal') return MobileShell({nav: scr.nav || 'lieu', body: baseMobile(scr), overlay: modalOverlay(scr)});
  return MobileShell({nav: scr.nav || 'plus', body: Fullscreen({title: scr.title, body: scr.body, right: scr.right || ''})});
}

/* --- état --- */
let device = 'pc', mode = 'single', current = 'combat';
const frameClass = () => device === 'pc' ? 'pc' : device === 'mobile' ? 'mobile' : 'tablet';

function effectiveDevice(scr) { return scr.pcOnly ? 'pc' : device; }
function frameHTML(scr) {
  const dev = effectiveDevice(scr);
  const inner = dev === 'pc' ? renderPC(scr) : renderMobile(scr);
  const cls = dev === 'pc' ? 'pc' : dev === 'mobile' ? 'mobile' : 'tablet';
  return `<div class="frame ${cls}">${inner}</div>`;
}

function sideNav() {
  const groups = [...new Set(SCREENS.map(s => s.group))];
  document.getElementById('side').innerHTML = groups.map(g => `
    <h4>${g}</h4>
    ${SCREENS.filter(s => s.group === g).map(s => `
      <a data-id="${s.id}" class="${s.id === current ? 'on' : ''}">
        ${s.label}<span class="tag">${s.kind === 'modal' ? 'modale' : s.kind === 'fs' ? 'plein écran' : s.kind === 'custom' ? 'page' : 'fenêtre'}</span>
      </a>`).join('')}`).join('');
  document.querySelectorAll('#side a').forEach(a => a.onclick = () => { current = a.dataset.id; render(); });
}

function render() {
  byId.guide.body = guideBody(); /* le Guide se recompose selon l'ecran d'origine */
  sideNav();
  const wrap = document.getElementById('stageWrap');
  document.getElementById('subtitle').textContent =
    `${SCREENS.length} affichages · PC 1280 · tablette 768 · mobile 390 · 10 thèmes`;

  if (mode === 'overview') {
    wrap.style.padding = '18px';
    wrap.innerHTML = `<div class="overview">${SCREENS.map(s => {
      const dev = effectiveDevice(s);
      const inner = dev === 'pc' ? renderPC(s) : renderMobile(s);
      const fw = dev === 'pc' ? 1280 : dev === 'mobile' ? 390 : 768;
      const fh = dev === 'pc' ? 800 : dev === 'mobile' ? 844 : 1024;
      const scale = 300 / fh;
      const cls = dev === 'pc' ? 'pc' : dev === 'mobile' ? 'mobile' : 'tablet';
      return `<div class="ov-item">
        <div class="ov-holder" style="width:${Math.round(fw*scale)}px"><div class="frame ${cls}" style="transform:scale(${scale})">${inner}</div></div>
        <div class="cap"><b>${esc(s.label)}</b><br>${esc(s.group)}</div></div>`;
    }).join('')}</div>`;
    return;
  }

  const scr = byId[current];
  wrap.style.padding = '22px';
  wrap.innerHTML = `
    <div>
      <div class="note"><b>${esc(scr.label)}</b> — ${esc(scr.note || '')}</div>
      ${frameHTML(scr)}
      <div class="compose">réutilise : ${(scr.uses || []).map(u => `<code>${esc(u)}</code>`).join(' · ')}</div>
    </div>`;
}

/* contrôles */
document.querySelectorAll('#devs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#devs button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true'); device = b.dataset.dev; render();
});
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true'); mode = b.dataset.mode; render();
});
document.getElementById('theme').onchange = (e) => { document.documentElement.setAttribute('data-theme', e.target.value); };
document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = SCREENS.findIndex(s => s.id === current);
  const n = (i + (e.key === 'ArrowRight' ? 1 : SCREENS.length - 1)) % SCREENS.length;
  current = SCREENS[n].id; render();
});
render();

</script>
</body>
</html>
