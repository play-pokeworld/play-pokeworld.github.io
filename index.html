<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values on notched phones; without it the layout thinks the screen is a plain rectangle and content slips under the notch / home bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PokéWorld</title>
  <link rel="icon" type="image/png" href="assets/images/Icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Single root container mounted by the Engine / PageManager -->
  <div id="app-root"></div>

  <!-- ES module entry point; <html lang> is kept in sync by AppShell -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
