name: Test and deploy PokéWorld to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests and audits
        run: |
          npm test
          npm run audit:i18n
          npm run audit:contrast
      - name: Stamp the deployed source commit
        env:
          DEPLOYMENT_ID: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha = process.env.DEPLOYMENT_ID;
          if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Unexpected source commit SHA');
          fs.writeFileSync('src/config/DeploymentConfig.js', `/** @file DeploymentConfig.js — current Pages deployment fingerprint. */\nexport const DeploymentConfig = Object.freeze({\n  DEPLOYMENT_ID: '${sha}'\n});\n`);
          NODE
      - name: Prepare static game site
        run: |
          mkdir -p site
          cp -a index.html manifest.webmanifest sw.js assets src site/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
